<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0612">
<title>Srpski Studio – Serbisch lernen</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Srpski">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   SRPSKI STUDIO — Design-System
   Theme: "Belgrade Night" — warme rakija-Töne auf tiefer Donau-Nacht
   ===================================================================== */
:root{
  /* base palette */
  --bg-0:#0a0612;
  --bg-1:#120a1f;
  --bg-2:#1a1130;
  --surface:#1f1638;
  --surface-2:#2a1f4a;
  --surface-3:#352859;
  --border:rgba(255,255,255,0.08);
  --border-strong:rgba(255,255,255,0.16);

  /* text */
  --text:#f5f0ff;
  --text-2:#cfc7e6;
  --text-3:#9087b3;
  --text-4:#6b6191;

  /* brand */
  --accent:#ffb547;          /* rakija amber */
  --accent-2:#ff7a5c;         /* sunset coral */
  --accent-3:#c84d6a;         /* serbian red, gedämpft */
  --info:#7fa8ff;             /* danube blue */
  --good:#5be5a3;             /* mint */
  --bad:#ff6b8a;
  --warn:#ffcc66;

  /* serbian flag (gedämpft) */
  --sr1:#c4302b;
  --sr2:#1b3a8a;
  --sr3:#fafafa;

  /* shadows / elevation */
  --shadow-sm:0 2px 6px rgba(0,0,0,.35);
  --shadow-md:0 8px 24px rgba(0,0,0,.45);
  --shadow-lg:0 24px 60px rgba(0,0,0,.55);
  --glow-accent:0 8px 28px rgba(255,181,71,.28);
  --glow-good:0 8px 24px rgba(91,229,163,.25);

  /* spacing */
  --r-sm:8px; --r-md:14px; --r-lg:20px; --r-xl:28px;
  --tap:48px;

  /* motion */
  --ease:cubic-bezier(.2,.8,.2,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
}

/* light-mode opt-in */
html[data-theme="light"]{
  --bg-0:#f6f3ee; --bg-1:#ede7df; --bg-2:#e2dbd0;
  --surface:#ffffff; --surface-2:#faf6ee; --surface-3:#f1ead8;
  --border:rgba(0,0,0,0.08); --border-strong:rgba(0,0,0,0.16);
  --text:#1c1530; --text-2:#3b3357; --text-3:#5e5677; --text-4:#8a82a3;
  --shadow-sm:0 1px 4px rgba(28,21,48,.06);
  --shadow-md:0 6px 18px rgba(28,21,48,.10);
  --shadow-lg:0 18px 40px rgba(28,21,48,.14);
}

/* alt theme: "Kafana" — warm parchment-gold dark */
html[data-theme="kafana"]{
  --bg-0:#100905; --bg-1:#1a0e08; --bg-2:#23150c;
  --surface:#2c1c11; --surface-2:#3a2516; --surface-3:#48301d;
  --accent:#ffd56b; --accent-2:#ff9b54; --accent-3:#e76f51;
  --info:#94c5cc; --good:#a3c293;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{background:var(--bg-0);color-scheme:dark}
html[data-theme="light"]{color-scheme:light}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-feature-settings:"cv11","ss01","ss03";
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
  padding:env(safe-area-inset-top) 0 calc(74px + env(safe-area-inset-bottom)) 0;
  position:relative;
  background:
    radial-gradient(80% 60% at 15% -10%, rgba(255,181,71,.16) 0%, transparent 60%),
    radial-gradient(70% 60% at 100% 10%, rgba(200,77,106,.20) 0%, transparent 60%),
    radial-gradient(60% 50% at 50% 100%, rgba(127,168,255,.10) 0%, transparent 60%),
    linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 100%);
  background-attachment:fixed;
}
html[data-theme="light"] body{
  background:
    radial-gradient(80% 60% at 15% -10%, rgba(255,181,71,.20) 0%, transparent 60%),
    radial-gradient(70% 60% at 100% 10%, rgba(200,77,106,.15) 0%, transparent 60%),
    linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 100%);
}

/* animated subtle aurora */
body::before{
  content:""; position:fixed; inset:-30%;
  background:
    radial-gradient(40% 30% at 20% 30%, rgba(255,181,71,.10), transparent 70%),
    radial-gradient(35% 30% at 80% 70%, rgba(200,77,106,.10), transparent 70%);
  filter:blur(40px);
  animation:aurora 24s ease-in-out infinite alternate;
  z-index:-1; pointer-events:none;
}
@keyframes aurora{
  0%   { transform:translate(0,0) rotate(0deg) }
  100% { transform:translate(2%,-2%) rotate(2deg) }
}

/* ====================== TOPBAR ====================== */
.topbar{
  position:sticky; top:0; z-index:30;
  display:flex; align-items:center; gap:10px;
  padding:12px 16px;
  backdrop-filter:saturate(140%) blur(18px);
  -webkit-backdrop-filter:saturate(140%) blur(18px);
  background:linear-gradient(180deg, rgba(10,6,18,.78), rgba(10,6,18,.5));
  border-bottom:1px solid var(--border);
}
html[data-theme="light"] .topbar{
  background:linear-gradient(180deg, rgba(255,255,255,.78), rgba(255,255,255,.4));
}
.brand{display:flex; align-items:center; gap:10px; font-weight:800; letter-spacing:-.01em}
.brand-logo{
  width:34px; height:34px; border-radius:10px; position:relative; flex-shrink:0;
  background:
    linear-gradient(180deg, var(--sr1) 0 33%, var(--sr2) 33% 66%, var(--sr3) 66% 100%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.2), var(--shadow-sm);
}
.brand-logo::after{
  content:"С"; position:absolute; inset:0; display:grid; place-items:center;
  font-family:'Plus Jakarta Sans',serif; font-weight:800; color:#fff;
  text-shadow:0 1px 4px rgba(0,0,0,.55);
  font-size:18px;
}
.brand-text{display:flex; flex-direction:column; line-height:1}
.brand-text b{font-size:15px}
.brand-text span{font-size:11px; color:var(--text-3); margin-top:2px; letter-spacing:.05em; text-transform:uppercase}

.topbar-stats{margin-left:auto; display:flex; gap:6px; align-items:center}
.stat-chip{
  display:inline-flex; align-items:center; gap:6px;
  padding:7px 11px; border-radius:99px; font-size:13px; font-weight:600;
  background:var(--surface); border:1px solid var(--border);
  color:var(--text-2);
  transition:.2s var(--ease);
}
.stat-chip:hover{border-color:var(--border-strong); transform:translateY(-1px)}
.stat-chip.xp{color:var(--accent)}
.stat-chip.streak{color:var(--accent-2)}
.stat-chip.streak.alive .ico{filter:drop-shadow(0 0 6px rgba(255,122,92,.7))}
.stat-chip .ico{font-size:14px}
.stat-chip .num{font-variant-numeric:tabular-nums}
.icon-btn{
  width:38px; height:38px; border-radius:10px; border:1px solid var(--border);
  background:var(--surface); color:var(--text-2); cursor:pointer;
  display:grid; place-items:center; transition:.2s var(--ease);
}
.icon-btn:hover{color:var(--text); border-color:var(--border-strong); transform:translateY(-1px)}
.icon-btn.subtle{background:transparent; border-color:transparent; color:var(--text-3)}
.icon-btn.subtle:hover{background:var(--surface)}

/* ====================== MAIN CONTAINER ====================== */
main{
  max-width:880px; margin:0 auto; padding:18px 16px 24px;
  animation:fadeUp .35s var(--ease-out);
}
@keyframes fadeUp{
  from{opacity:0; transform:translateY(8px)}
  to{opacity:1; transform:translateY(0)}
}
h1,h2,h3,h4{margin:0; letter-spacing:-.015em; font-family:'Plus Jakarta Sans','Inter',sans-serif}
h1{font-size:26px; font-weight:800}
h2{font-size:20px; font-weight:700}
h3{font-size:16px; font-weight:700}
.section{margin:24px 0}
.section-head{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:12px; gap:10px}
.section-head .lead{display:flex; flex-direction:column; gap:2px}
.section-head .lead small{color:var(--text-3); font-size:12px}
.section-head .more{font-size:13px; color:var(--text-3); cursor:pointer; padding:4px 8px; border-radius:8px}
.section-head .more:hover{color:var(--text); background:var(--surface)}

/* ====================== CARDS ====================== */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r-lg);
  padding:16px;
  position:relative;
  transition:transform .18s var(--ease), border-color .18s var(--ease), box-shadow .18s var(--ease);
}
.card:hover{border-color:var(--border-strong)}
.card.flat{background:transparent; border:1px dashed var(--border)}
.card.elev{box-shadow:var(--shadow-md)}
.card.gradient{
  background:
    linear-gradient(135deg, rgba(255,181,71,.06), rgba(200,77,106,.06)),
    var(--surface);
}
.card .row{display:flex; gap:12px; align-items:center}
.card .row.between{justify-content:space-between}
.card .row.wrap{flex-wrap:wrap}
.muted{color:var(--text-3)}
.tiny{font-size:12px}

/* hero */
.hero{
  position:relative; overflow:hidden;
  background:
    radial-gradient(120% 80% at 0% 0%, rgba(255,181,71,.18), transparent 60%),
    radial-gradient(100% 90% at 100% 100%, rgba(200,77,106,.20), transparent 55%),
    linear-gradient(135deg, var(--surface-2), var(--surface));
  border:1px solid var(--border-strong);
  border-radius:var(--r-xl);
  padding:22px;
}
.hero::after{
  content:""; position:absolute; right:-40px; top:-40px;
  width:220px; height:220px; border-radius:50%;
  background:radial-gradient(circle, rgba(255,181,71,.18), transparent 70%);
  filter:blur(20px); pointer-events:none;
}
.hero h1{position:relative; z-index:1}
.hero p{color:var(--text-2); margin:6px 0 0; font-size:14px; line-height:1.55; max-width:62ch; position:relative}
.hero .hero-stats{display:flex; gap:18px; margin-top:14px; flex-wrap:wrap; position:relative}
.hero-stat{display:flex; flex-direction:column; gap:2px}
.hero-stat .v{font-size:24px; font-weight:800; line-height:1; color:var(--text); font-variant-numeric:tabular-nums}
.hero-stat .l{font-size:11px; color:var(--text-3); text-transform:uppercase; letter-spacing:.08em}
.hero-stat.accent .v{color:var(--accent)}

/* ====================== BUTTONS ====================== */
button, .btn{
  font:inherit; color:var(--text);
  background:var(--surface); border:1px solid var(--border);
  padding:11px 16px; border-radius:12px; cursor:pointer;
  transition:.18s var(--ease);
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  min-height:42px; font-weight:600; letter-spacing:-.005em;
  user-select:none;
}
button:hover, .btn:hover{border-color:var(--border-strong); transform:translateY(-1px)}
button:active, .btn:active{transform:translateY(0)}
button:disabled{opacity:.45; cursor:not-allowed; transform:none}
button.primary, .btn.primary{
  background:linear-gradient(135deg, var(--accent), var(--accent-2));
  color:#1a0a05; border:none; font-weight:700;
  box-shadow:var(--glow-accent);
}
button.primary:hover{filter:brightness(1.06); box-shadow:0 12px 32px rgba(255,181,71,.36)}
button.success{background:linear-gradient(135deg, var(--good), #3fcf90); color:#04220f; border:none; font-weight:700}
button.danger{background:rgba(255,107,138,.12); border-color:rgba(255,107,138,.4); color:var(--bad)}
button.ghost{background:transparent}
button.ghost:hover{background:var(--surface)}
button.icon-only{padding:0; width:42px; height:42px; flex-shrink:0}
button.lg{padding:14px 22px; font-size:16px; min-height:54px; border-radius:14px}
button.full{width:100%}
.btn.tag{padding:6px 12px; min-height:32px; font-size:12px; border-radius:99px; font-weight:600}

/* ====================== BOTTOM TAB-BAR ====================== */
.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  padding:8px 12px calc(8px + env(safe-area-inset-bottom));
  background:linear-gradient(0deg, rgba(10,6,18,.95), rgba(10,6,18,.78));
  backdrop-filter:blur(22px) saturate(140%);
  -webkit-backdrop-filter:blur(22px) saturate(140%);
  border-top:1px solid var(--border);
}
html[data-theme="light"] .tabbar{
  background:linear-gradient(0deg, rgba(255,255,255,.95), rgba(255,255,255,.78));
}
.tabs{
  display:grid; grid-template-columns:repeat(5, 1fr);
  max-width:560px; margin:0 auto; gap:4px;
}
.tab{
  background:transparent; border:none; padding:8px 4px; border-radius:12px;
  display:flex; flex-direction:column; align-items:center; gap:3px;
  color:var(--text-3); cursor:pointer; transition:.18s var(--ease);
  min-height:54px; font-weight:600;
}
.tab .ti{font-size:20px; line-height:1; transition:transform .25s var(--ease-out)}
.tab .tl{font-size:10.5px; letter-spacing:.02em}
.tab:hover{color:var(--text-2)}
.tab.active{color:var(--accent)}
.tab.active .ti{transform:translateY(-2px) scale(1.08)}
.tab .tdot{position:absolute; top:6px; right:calc(50% - 16px); width:6px; height:6px; border-radius:50%; background:var(--accent-2); display:none}
.tab.has-due .tdot{display:block}

/* ====================== UTIL ====================== */
.grid{display:grid; gap:10px}
.grid.cols-2{grid-template-columns:1fr 1fr}
.grid.cols-3{grid-template-columns:repeat(3,1fr)}
.grid.auto-220{grid-template-columns:repeat(auto-fit, minmax(220px,1fr))}
.grid.auto-180{grid-template-columns:repeat(auto-fit, minmax(180px,1fr))}
.grid.auto-160{grid-template-columns:repeat(auto-fit, minmax(160px,1fr))}
.grid.auto-140{grid-template-columns:repeat(auto-fit, minmax(140px,1fr))}
.row{display:flex; gap:10px}
.row.wrap{flex-wrap:wrap}
.row.between{justify-content:space-between}
.row.center{align-items:center}
.col{display:flex; flex-direction:column; gap:8px}
.spacer{flex:1}
.center{text-align:center}
.divider{height:1px; background:var(--border); margin:14px 0}
.kbd{
  font-family:'JetBrains Mono', ui-monospace, monospace; font-size:11px;
  padding:2px 6px; border-radius:4px; background:var(--surface-3); color:var(--text-2);
  border:1px solid var(--border); box-shadow:inset 0 -1px 0 var(--border);
}

/* progress ring */
.ring{--p:0; --sz:64px; --bw:7px;
  width:var(--sz); height:var(--sz); border-radius:50%;
  background:conic-gradient(var(--accent) calc(var(--p)*1%), var(--surface-3) 0);
  display:grid; place-items:center; flex-shrink:0;
  position:relative;
}
.ring::before{
  content:""; position:absolute; inset:var(--bw);
  background:var(--surface); border-radius:50%;
}
.ring-content{position:relative; z-index:1; text-align:center; line-height:1}
.ring-content b{font-size:18px; font-weight:800; font-variant-numeric:tabular-nums}
.ring-content small{font-size:9px; color:var(--text-3); text-transform:uppercase; letter-spacing:.08em; display:block; margin-top:2px}

/* progress bar */
.bar{height:6px; background:var(--surface-3); border-radius:99px; overflow:hidden; border:1px solid var(--border)}
.bar i{display:block; height:100%; background:linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius:99px; transition:width .5s var(--ease-out)}
.bar.thin{height:4px}
.bar.good i{background:linear-gradient(90deg, var(--good), #3fcf90)}
.bar.danger i{background:linear-gradient(90deg, var(--bad), var(--accent-3))}

/* badges */
.badge{
  display:inline-flex; align-items:center; gap:4px;
  padding:3px 8px; border-radius:99px; font-size:11px; font-weight:700;
  background:var(--surface-3); color:var(--text-2);
  border:1px solid var(--border);
  letter-spacing:.02em;
}
.badge.due{background:rgba(255,181,71,.14); color:var(--accent); border-color:rgba(255,181,71,.3)}
.badge.new{background:rgba(127,168,255,.14); color:var(--info); border-color:rgba(127,168,255,.3)}
.badge.done{background:rgba(91,229,163,.14); color:var(--good); border-color:rgba(91,229,163,.3)}
.badge.locked{background:transparent; color:var(--text-4)}
.badge.bre{background:rgba(255,122,92,.14); color:var(--accent-2); border-color:rgba(255,122,92,.3)}

/* tag chips for cats */
.chip{display:inline-flex; align-items:center; gap:4px; padding:4px 10px; border-radius:99px; font-size:11px;
  background:var(--surface-3); color:var(--text-2); cursor:pointer; user-select:none;
  border:1px solid var(--border);
}
.chip.active{background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:#1a0a05; border:none; font-weight:700}

/* ====================== LESSON / SET CARDS ====================== */
.tile{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg);
  padding:14px; cursor:pointer; transition:.18s var(--ease); position:relative; overflow:hidden;
  text-align:left;
  display:flex; flex-direction:column; gap:8px;
}
.tile:hover{transform:translateY(-2px); border-color:var(--border-strong); box-shadow:var(--shadow-md)}
.tile.disabled{opacity:.55; cursor:not-allowed; pointer-events:none}
.tile.done{border-color:rgba(91,229,163,.4)}
.tile.done::after{content:"✓"; position:absolute; top:10px; right:12px; color:var(--good); font-weight:800; font-size:14px}
.tile .icon{font-size:22px; width:42px; height:42px; display:grid; place-items:center; border-radius:12px;
  background:var(--surface-3); margin-bottom:2px}
.tile .ttl{font-weight:700; font-size:15px; color:var(--text)}
.tile .sub{font-size:12px; color:var(--text-3); line-height:1.45}
.tile .foot{display:flex; gap:6px; align-items:center; margin-top:auto; padding-top:6px; flex-wrap:wrap}
.tile.glow:hover{box-shadow:var(--glow-accent)}

/* level cards */
.level-tile{
  background:linear-gradient(135deg, var(--surface-2), var(--surface));
  border-radius:var(--r-xl); padding:18px 18px 20px;
  border:1px solid var(--border-strong);
  position:relative; overflow:hidden; cursor:pointer;
  transition:.2s var(--ease);
}
.level-tile:hover{transform:translateY(-3px); box-shadow:var(--shadow-md)}
.level-tile::before{
  content:""; position:absolute; right:-30px; top:-30px; width:140px; height:140px;
  border-radius:50%; background:radial-gradient(circle, var(--c, var(--accent)), transparent 70%);
  opacity:.16; filter:blur(8px);
}
.level-tile .num{font-size:13px; color:var(--text-3); font-weight:700; text-transform:uppercase; letter-spacing:.08em}
.level-tile h3{font-size:20px; margin:4px 0 4px}
.level-tile .desc{color:var(--text-3); font-size:13px; line-height:1.5; margin-bottom:14px}

/* ====================== FLASHCARD ====================== */
.flashcard-wrap{perspective:1500px; padding:6px}
.flashcard{
  position:relative; min-height:300px;
  transform-style:preserve-3d; transition:transform .55s var(--ease-out);
  cursor:pointer; border-radius:var(--r-xl);
}
.flashcard.flipped{transform:rotateY(180deg)}
.flashcard .face{
  position:absolute; inset:0;
  backface-visibility:hidden; -webkit-backface-visibility:hidden;
  border-radius:var(--r-xl);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:32px 24px; text-align:center;
  background:linear-gradient(160deg, var(--surface-2), var(--surface));
  border:1px solid var(--border-strong);
  box-shadow:var(--shadow-md);
  overflow:hidden;
}
.flashcard .face::before{
  content:""; position:absolute; inset:0;
  background:radial-gradient(circle at 30% 0%, rgba(255,181,71,.10), transparent 50%);
  pointer-events:none;
}
.flashcard .back{
  transform:rotateY(180deg);
  background:linear-gradient(160deg, #2a3a26, var(--surface-2));
  border-color:rgba(91,229,163,.35);
}
.flashcard .word{font-family:'Plus Jakarta Sans',serif; font-size:42px; font-weight:800; line-height:1.1; letter-spacing:-.02em; word-break:break-word}
.flashcard .word-small{font-size:32px}
.flashcard .ipa{color:var(--good); font-size:14px; margin-top:8px; font-style:italic; letter-spacing:.02em}
.flashcard .alt{color:var(--text-3); font-size:14px; margin-top:8px}
.flashcard .note{color:var(--text-3); font-size:13px; margin-top:14px; max-width:80%; line-height:1.45}
.flashcard .face .play-btn{position:absolute; right:14px; top:14px; width:42px; height:42px}
.flashcard .face .hint{position:absolute; bottom:14px; left:0; right:0; color:var(--text-4); font-size:11px; letter-spacing:.05em; text-transform:uppercase}
.flashcard-counter{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; color:var(--text-3); font-size:13px}

/* SRS quality buttons */
.qrow{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:14px}
.qrow button{padding:11px 6px; flex-direction:column; min-height:62px; gap:2px}
.qrow button .ql{font-size:14px; font-weight:700}
.qrow button .qs{font-size:10px; color:var(--text-3)}
.qrow .q-again{background:rgba(255,107,138,.10); border-color:rgba(255,107,138,.32); color:var(--bad)}
.qrow .q-hard{background:rgba(255,204,102,.10); border-color:rgba(255,204,102,.32); color:var(--warn)}
.qrow .q-good{background:rgba(91,229,163,.10); border-color:rgba(91,229,163,.32); color:var(--good)}
.qrow .q-easy{background:rgba(127,168,255,.10); border-color:rgba(127,168,255,.32); color:var(--info)}
.qrow button:hover{transform:translateY(-1px); filter:brightness(1.15)}

/* ====================== QUIZ ====================== */
.quiz-prompt{
  text-align:center; padding:24px 18px;
  background:linear-gradient(135deg, var(--surface-2), var(--surface));
  border:1px solid var(--border-strong); border-radius:var(--r-xl);
  margin-bottom:14px;
}
.quiz-prompt .q{font-family:'Plus Jakarta Sans',serif; font-size:30px; font-weight:800; line-height:1.1; word-break:break-word}
.quiz-prompt .qsub{color:var(--text-3); font-size:13px; margin-top:6px}
.quiz-options{display:grid; grid-template-columns:1fr; gap:8px}
.quiz-options button{padding:14px 16px; text-align:left; justify-content:flex-start; font-size:15px; min-height:56px; line-height:1.4}
.quiz-options button.correct{background:rgba(91,229,163,.12); border-color:var(--good); color:var(--good)}
.quiz-options button.wrong{background:rgba(255,107,138,.12); border-color:var(--bad); color:var(--bad)}
.quiz-options button .num{display:inline-flex; width:24px; height:24px; border-radius:6px; background:var(--surface-3); font-size:11px; align-items:center; justify-content:center; flex-shrink:0; margin-right:10px; font-weight:700; color:var(--text-3)}

/* ====================== TYPING ====================== */
.type-prompt{text-align:center; margin:18px 0 12px}
.type-prompt .q{font-size:30px; font-weight:800; font-family:'Plus Jakarta Sans',serif; letter-spacing:-.01em}
.type-prompt .qhint{color:var(--text-3); font-size:13px; margin-top:6px}
.typing-input{
  width:100%; padding:18px 20px;
  background:var(--surface); border:2px solid var(--border-strong);
  border-radius:14px; color:var(--text);
  font-size:20px; text-align:center; letter-spacing:.5px;
  transition:.2s var(--ease);
  font-family:'Plus Jakarta Sans',sans-serif; font-weight:600;
}
.typing-input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 4px rgba(255,181,71,.15)}
.typing-input.correct{border-color:var(--good); background:rgba(91,229,163,.08)}
.typing-input.wrong{border-color:var(--bad); background:rgba(255,107,138,.08)}

/* ====================== BUILDER ====================== */
.builder-slots{
  background:var(--surface); border:2px dashed var(--border-strong); border-radius:14px;
  min-height:64px; padding:12px;
  display:flex; flex-wrap:wrap; gap:6px; align-items:center;
  margin:12px 0;
}
.builder-slots.shake{animation:shake .35s var(--ease)}
@keyframes shake{0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)}}
.builder-bank{display:flex; flex-wrap:wrap; gap:6px; margin:12px 0}
.token{
  padding:9px 14px; border-radius:10px;
  background:var(--surface); border:1px solid var(--border-strong);
  cursor:pointer; font-size:15px; transition:.18s var(--ease); font-weight:600;
  user-select:none;
}
.token:hover{transform:translateY(-1px); border-color:var(--accent)}
.token.placed{background:rgba(91,229,163,.10); border-color:var(--good); color:var(--good)}
.token.used{opacity:.2; pointer-events:none; transform:scale(.95)}

/* ====================== SPEAK ====================== */
.target-word{
  font-family:'Plus Jakarta Sans',serif;
  font-size:38px; font-weight:800; text-align:center; margin:16px 0 4px;
  letter-spacing:-.02em;
}
.target-de{color:var(--text-3); text-align:center; font-size:14px; margin-bottom:12px}
.mic-btn{
  display:inline-flex; align-items:center; gap:10px;
  background:linear-gradient(135deg, var(--accent-3), var(--accent-2));
  border:none; color:#fff; padding:16px 26px; border-radius:99px;
  font-weight:700; font-size:16px; cursor:pointer;
  box-shadow:0 8px 26px rgba(200,77,106,.35);
  transition:.2s var(--ease);
  min-height:56px;
}
.mic-btn:hover{transform:scale(1.03)}
.mic-btn.listening{background:linear-gradient(135deg, var(--good), #3fcf90); animation:pulse 1.2s ease-in-out infinite}
.mic-btn:disabled{opacity:.5; cursor:not-allowed; animation:none; transform:none}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(91,229,163,.55)}
  50%{box-shadow:0 0 0 18px rgba(91,229,163,0)}
}
.speech-result{margin-top:14px; padding:14px; border-radius:14px; font-size:14px;
  background:var(--surface); border:1px solid var(--border)}
.speech-result.good{background:rgba(91,229,163,.08); border-color:var(--good); color:var(--good)}
.speech-result.meh{background:rgba(255,204,102,.08); border-color:var(--warn); color:var(--warn)}
.speech-result.bad{background:rgba(255,107,138,.08); border-color:var(--bad); color:var(--bad)}
.speech-meter{height:10px; background:var(--surface-3); border-radius:99px; overflow:hidden; margin:10px 0}
.speech-meter i{display:block; height:100%; transition:width .5s var(--ease-out)}
.wave{display:flex; gap:3px; height:30px; align-items:center; justify-content:center; margin:10px 0}
.wave i{display:block; width:4px; background:var(--good); border-radius:2px;
  animation:wv 1s ease-in-out infinite alternate}
.wave i:nth-child(2){animation-delay:.1s}
.wave i:nth-child(3){animation-delay:.2s}
.wave i:nth-child(4){animation-delay:.3s}
.wave i:nth-child(5){animation-delay:.4s}
.wave i:nth-child(6){animation-delay:.5s}
.wave i:nth-child(7){animation-delay:.6s}
@keyframes wv{0%{height:8px} 100%{height:28px}}

/* ====================== DIALOGUE ====================== */
.dialog-scene{
  background:linear-gradient(135deg, rgba(127,168,255,.08), rgba(255,181,71,.08));
  border:1px solid var(--border); border-radius:var(--r-lg); padding:14px;
  font-size:13px; color:var(--text-2); line-height:1.55;
}
.dlg-line{display:flex; gap:10px; margin:10px 0; align-items:flex-end}
.dlg-line.you{justify-content:flex-end}
.dlg-line.you .dlg-avatar{order:2}
.dlg-avatar{
  width:36px; height:36px; border-radius:50%; flex-shrink:0;
  display:grid; place-items:center; font-size:14px; font-weight:700;
  background:var(--surface-3); color:var(--text-2);
  border:1px solid var(--border);
}
.dlg-line.you .dlg-avatar{background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:#1a0a05; border:none}
.dlg-bubble{
  max-width:78%;
  background:var(--surface); border:1px solid var(--border);
  padding:10px 14px; border-radius:18px;
  position:relative;
}
.dlg-line.you .dlg-bubble{
  background:linear-gradient(135deg, rgba(255,181,71,.10), rgba(200,77,106,.06));
  border-color:rgba(255,181,71,.25);
  border-bottom-right-radius:6px;
}
.dlg-line:not(.you) .dlg-bubble{border-bottom-left-radius:6px}
.dlg-bubble .who{font-size:10px; color:var(--text-3); font-weight:700; letter-spacing:.05em; text-transform:uppercase; margin-bottom:3px}
.dlg-bubble .sr{font-weight:600; font-size:15px; line-height:1.35}
.dlg-bubble .de{color:var(--text-3); font-size:13px; margin-top:4px}
.dlg-bubble .b-play{margin-top:6px; padding:4px 10px; font-size:11px; min-height:28px; border-radius:8px}

/* ====================== LIVE-KONVERSATION ====================== */
.live-stage{
  background:linear-gradient(135deg, rgba(127,168,255,.06), rgba(255,181,71,.06));
  border:1px solid var(--border); border-radius:var(--r-lg);
  padding:14px; min-height:340px; max-height:60vh; overflow-y:auto;
  scroll-behavior:smooth;
}
.live-status{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:14px; border-radius:14px; margin-top:14px;
  background:var(--surface); border:1px solid var(--border);
  font-size:14px; min-height:64px;
}
.live-status.listening{
  background:linear-gradient(135deg, rgba(91,229,163,.10), rgba(127,168,255,.06));
  border-color:rgba(91,229,163,.4);
}
.live-status.speaking{
  background:linear-gradient(135deg, rgba(127,168,255,.10), rgba(200,77,106,.06));
  border-color:rgba(127,168,255,.4);
}
.live-status.help{
  background:linear-gradient(135deg, rgba(255,181,71,.12), rgba(255,107,138,.06));
  border-color:rgba(255,181,71,.5);
}
.live-status .dot{
  width:10px; height:10px; border-radius:50%; background:var(--text-3);
  flex-shrink:0;
}
.live-status.listening .dot{background:var(--good); animation:pulse 1.1s ease-in-out infinite}
.live-status.speaking .dot{background:var(--info); animation:pulse 1.1s ease-in-out infinite}
.live-status.help .dot{background:var(--accent)}
@keyframes pulse{0%,100%{transform:scale(1); opacity:1} 50%{transform:scale(1.5); opacity:.6}}
.live-status .grow{flex:1; min-width:0}
.live-status .hint{font-size:12px; color:var(--text-3); margin-top:3px}
.live-actions{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap}
.live-actions button{flex:1; min-width:100px}
.dlg-bubble.assisted{
  background:rgba(255,181,71,.08);
  border-color:rgba(255,181,71,.35);
}
.dlg-bubble .heard{
  font-size:12px; color:var(--text-3); margin-top:4px;
  font-style:italic;
}
.dlg-bubble.you-correct{border-color:var(--good); background:rgba(91,229,163,.08)}

/* ====================== HEATMAP ====================== */
.heatmap{display:grid; grid-template-columns:repeat(13,1fr); gap:3px; margin-top:8px}
.heatmap .day{
  aspect-ratio:1; border-radius:3px;
  background:var(--surface-3); border:1px solid var(--border);
  transition:.15s var(--ease); cursor:default;
}
.heatmap .day.l1{background:rgba(255,181,71,.20); border-color:rgba(255,181,71,.25)}
.heatmap .day.l2{background:rgba(255,181,71,.45); border-color:rgba(255,181,71,.5)}
.heatmap .day.l3{background:rgba(255,181,71,.7); border-color:rgba(255,181,71,.7)}
.heatmap .day.l4{background:linear-gradient(135deg, var(--accent), var(--accent-2)); border:none}
.heatmap .day:hover{transform:scale(1.4); z-index:5; box-shadow:0 4px 10px rgba(0,0,0,.3)}
.heatmap-legend{display:flex; gap:6px; align-items:center; font-size:10px; color:var(--text-3); margin-top:8px; justify-content:flex-end}
.heatmap-legend i{width:10px; height:10px; border-radius:2px; display:inline-block}

/* ====================== ACHIEVEMENT GRID ====================== */
.ach-card{
  background:var(--surface); border:1px solid var(--border); border-radius:14px;
  padding:14px; display:flex; gap:12px; align-items:center;
  transition:.18s var(--ease);
}
.ach-card:hover{border-color:var(--border-strong)}
.ach-card.locked{opacity:.4}
.ach-card.got{
  background:linear-gradient(135deg, rgba(255,181,71,.10), rgba(200,77,106,.06));
  border-color:rgba(255,181,71,.4);
}
.ach-card .ai{font-size:30px; width:50px; height:50px; flex-shrink:0;
  display:grid; place-items:center; border-radius:14px;
  background:var(--surface-3)}
.ach-card.got .ai{background:linear-gradient(135deg, var(--accent), var(--accent-2))}
.ach-card .at{font-weight:700; font-size:14px}
.ach-card .ad{color:var(--text-3); font-size:12px; line-height:1.4; margin-top:2px}

/* ====================== MATCH PAIRS GAME ====================== */
.match-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:14px}
@media (max-width:520px){ .match-grid{grid-template-columns:repeat(2,1fr)} }
.mcell{
  aspect-ratio:5/4;
  background:var(--surface); border:1px solid var(--border-strong);
  border-radius:14px; cursor:pointer;
  display:grid; place-items:center; padding:10px; text-align:center;
  font-size:13px; line-height:1.3; font-weight:600;
  transition:.2s var(--ease);
  user-select:none;
}
.mcell.sr{font-family:'Plus Jakarta Sans',serif; font-size:14px}
.mcell:hover{transform:translateY(-2px); border-color:var(--accent)}
.mcell.sel{background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:#1a0a05; border:none; transform:scale(.97)}
.mcell.matched{background:rgba(91,229,163,.10); border-color:var(--good); color:var(--good); cursor:default; pointer-events:none}
.mcell.miss{animation:shake .35s var(--ease); border-color:var(--bad); background:rgba(255,107,138,.10)}

/* ====================== SPEED ROUND ====================== */
.speed-hud{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 18px; border-radius:14px; margin-bottom:14px;
  background:linear-gradient(135deg, var(--surface-2), var(--surface));
  border:1px solid var(--border-strong);
}
.speed-hud .v{font-size:22px; font-weight:800; font-variant-numeric:tabular-nums}
.speed-hud .l{font-size:10px; color:var(--text-3); text-transform:uppercase; letter-spacing:.08em}
.speed-timer{height:6px; border-radius:99px; background:var(--surface-3); overflow:hidden; margin-bottom:14px}
.speed-timer i{display:block; height:100%; background:linear-gradient(90deg, var(--good), var(--accent), var(--bad)); transition:width .9s linear}

/* ====================== TOAST / CONFETTI ====================== */
.toast{
  position:fixed; left:50%; bottom:90px; transform:translate(-50%,8px);
  padding:10px 18px; border-radius:99px;
  background:rgba(20,12,40,.95); color:var(--text);
  border:1px solid var(--border-strong); box-shadow:var(--shadow-lg);
  font-size:14px; font-weight:600; z-index:60;
  opacity:0; transition:.3s var(--ease-out);
  display:inline-flex; align-items:center; gap:8px;
  backdrop-filter:blur(8px);
  white-space:nowrap;
}
.toast.show{opacity:1; transform:translate(-50%,0)}
.toast.good{border-color:rgba(91,229,163,.5); color:var(--good)}
.toast.bad{border-color:rgba(255,107,138,.5); color:var(--bad)}
.toast.ach{
  background:linear-gradient(135deg, rgba(255,181,71,.95), rgba(200,77,106,.95));
  color:#1a0a05; border:none; padding:14px 22px;
}

#confetti-canvas{position:fixed; inset:0; pointer-events:none; z-index:55}

/* ====================== MODAL / SHEET ====================== */
.sheet-bg{position:fixed; inset:0; background:rgba(0,0,0,.6); backdrop-filter:blur(4px); z-index:50; opacity:0; transition:.25s var(--ease); pointer-events:none}
.sheet-bg.show{opacity:1; pointer-events:auto}
.sheet{position:fixed; left:0; right:0; bottom:0; z-index:51; max-height:85vh; overflow-y:auto;
  background:var(--bg-1); border-top:1px solid var(--border-strong);
  border-radius:var(--r-xl) var(--r-xl) 0 0;
  padding:18px 18px calc(24px + env(safe-area-inset-bottom));
  transform:translateY(100%); transition:.3s var(--ease-out);
  box-shadow:0 -20px 60px rgba(0,0,0,.6);
}
.sheet.show{transform:translateY(0)}
.sheet .grip{width:42px; height:4px; border-radius:99px; background:var(--text-4); margin:0 auto 14px}
.sheet h2{margin-bottom:8px}

/* search */
.search-input{
  width:100%; padding:14px 16px 14px 42px;
  background:var(--surface); border:1px solid var(--border);
  border-radius:14px; color:var(--text); font-size:15px;
}
.search-wrap{position:relative}
.search-wrap::before{content:"⌕"; position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--text-3); font-size:18px}
.search-input:focus{outline:none; border-color:var(--accent)}

/* word library list */
.wl-item{
  display:flex; align-items:center; gap:12px; padding:10px 12px;
  border:1px solid var(--border); border-radius:12px;
  background:var(--surface); transition:.15s var(--ease);
}
.wl-item:hover{border-color:var(--border-strong)}
.wl-item .sr{font-weight:700; font-size:15px; font-family:'Plus Jakarta Sans',sans-serif}
.wl-item .de{color:var(--text-3); font-size:13px}
.wl-item .ipa{color:var(--good); font-size:11px; font-style:italic}
.wl-item .play{margin-left:auto; flex-shrink:0; width:36px; height:36px; padding:0}

/* tip card */
.tip{background:linear-gradient(135deg, rgba(127,168,255,.10), rgba(255,181,71,.06));
  border:1px solid var(--border); border-radius:14px;
  padding:12px 14px; font-size:13px; color:var(--text-2); line-height:1.55}
.tip b{color:var(--accent)}
.tip .ti{font-size:18px; margin-right:6px; vertical-align:middle}

/* set day timeline */
.day-track{display:flex; gap:5px; overflow-x:auto; padding:10px 4px; scrollbar-width:none}
.day-track::-webkit-scrollbar{display:none}
.day-pip{
  flex-shrink:0; width:40px; height:40px; border-radius:11px;
  background:var(--surface); border:1px solid var(--border);
  display:grid; place-items:center; cursor:pointer; font-weight:700; font-size:12px;
  color:var(--text-3);
  transition:.18s var(--ease); position:relative;
}
.day-pip:hover{transform:translateY(-2px); border-color:var(--border-strong); color:var(--text)}
.day-pip.done{background:rgba(91,229,163,.12); border-color:var(--good); color:var(--good)}
.day-pip.cur{background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:#1a0a05; border:none; transform:scale(1.08); box-shadow:var(--glow-accent)}
.day-pip.locked{opacity:.5; cursor:not-allowed}
.day-pip.weekstart::before{
  content:""; position:absolute; left:-3px; top:6px; bottom:6px; width:1px; background:var(--border-strong);
}

/* mode pills (within lesson) */
.mode-row{display:grid; grid-template-columns:repeat(auto-fit, minmax(120px,1fr)); gap:8px; margin:14px 0}
.mode-row button{flex-direction:column; padding:14px 10px; min-height:80px; gap:4px}
.mode-row button .mi{font-size:24px}
.mode-row button .ml{font-size:12px; font-weight:600}
.mode-row button.done{border-color:rgba(91,229,163,.4)}
.mode-row button.done::after{content:"✓"; position:absolute; top:6px; right:8px; color:var(--good); font-size:11px; font-weight:800}

/* responsive */
@media (max-width:520px){
  .topbar{padding:10px 14px}
  .stat-chip{padding:6px 9px; font-size:12px}
  main{padding:14px 14px 24px}
  h1{font-size:22px}
  .hero{padding:18px}
  .flashcard .word{font-size:34px}
  .target-word{font-size:32px}
  .quiz-prompt .q{font-size:24px}
  .level-tile h3{font-size:18px}
}

/* tap state for mobile */
@media (hover:none){
  .card:hover, .tile:hover{transform:none}
}

/* skeleton */
.skel{background:linear-gradient(90deg, var(--surface), var(--surface-2), var(--surface));
  background-size:200% 100%; animation:skel 1.4s ease-in-out infinite;
  border-radius:8px}
@keyframes skel{0%{background-position:0 0} 100%{background-position:-200% 0}}

/* footer credit */
.foot-credit{text-align:center; color:var(--text-4); font-size:11px; margin:30px 0 10px; letter-spacing:.05em}

/* === Wissenschafts-UI === */
/* Noticing-Highlights — Schmidt 1990 */
.nc   { text-decoration:underline; text-decoration-color:rgba(255,181,71,.55); text-decoration-thickness:2px; text-underline-offset:3px; }
.nc-2 { text-decoration-color:rgba(127,168,255,.55) }
.nc-3 { text-decoration-color:rgba(91,229,163,.55) }
.nc-4 { text-decoration-color:rgba(200,77,106,.55) }

/* Pre-Recall Box (Active Recall vor Auflösen) */
.recall-box{
  margin:14px 0; padding:14px; border:1px dashed var(--border-strong); border-radius:var(--r-md);
  background:rgba(127,168,255,.06);
}
.recall-box label{display:block; font-size:12px; color:var(--text-3); text-transform:uppercase; letter-spacing:.08em; margin-bottom:6px}
.recall-box input{
  width:100%; padding:12px 14px; font-size:18px; border-radius:10px;
  border:1px solid var(--border-strong); background:var(--surface);
  color:var(--text); outline:none;
}
.recall-box input:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(255,181,71,.18)}
.recall-hint{font-size:12px; color:var(--text-3); margin-top:6px}
.recall-skip{font-size:12px; color:var(--text-3); background:none; border:none; cursor:pointer; text-decoration:underline; margin-top:6px}

/* Mnemonik-Box */
.mnem-box{
  margin-top:10px; padding:12px 14px; border-radius:12px;
  background:linear-gradient(135deg, rgba(255,181,71,.08), rgba(255,122,92,.04));
  border-left:3px solid var(--accent);
  font-size:14px; color:var(--text-2); line-height:1.5;
}
.mnem-box b{color:var(--accent)}

/* Coverage-Bar */
.cov-card{padding:16px; margin-top:14px}
.cov-bar{
  height:14px; border-radius:99px; background:var(--surface-3); overflow:hidden;
  display:flex; margin:8px 0;
}
.cov-bar i{display:block; height:100%; background:linear-gradient(90deg, var(--good), var(--accent))}
.cov-row{display:flex; justify-content:space-between; font-size:12px; color:var(--text-3); margin-top:4px}

/* Forecast-Mini-Bars */
.forecast{display:flex; gap:4px; align-items:flex-end; height:42px; margin:6px 0 0}
.forecast i{flex:1; min-width:6px; background:linear-gradient(180deg, var(--accent), var(--accent-3)); border-radius:3px 3px 0 0; min-height:3px}
.forecast i:hover{outline:1px solid var(--accent)}

/* Wissenschafts-Tooltip / Quellen-Card */
.sci-pill{
  display:inline-flex; align-items:center; gap:4px; font-size:11px;
  padding:3px 8px; border-radius:99px;
  background:rgba(127,168,255,.12); color:var(--info); cursor:pointer;
  border:1px solid rgba(127,168,255,.25);
}
.sci-pill:hover{background:rgba(127,168,255,.22)}
.sci-card{
  margin-top:8px; padding:12px 14px; border-radius:12px;
  border:1px solid var(--border); background:var(--surface);
}
.sci-card h4{margin:0 0 4px; font-size:14px; color:var(--info)}
.sci-card .claim{font-size:13px; color:var(--text-2); margin:6px 0; line-height:1.5}
.sci-card a{display:block; font-size:12px; color:var(--accent); margin:4px 0; text-decoration:none}
.sci-card a:hover{text-decoration:underline}

/* Pre-Test card */
.pretest-q{padding:18px; border-radius:14px; background:var(--surface-2); margin:12px 0; text-align:center}
.pretest-q .pq{font-size:22px; font-weight:700; margin-bottom:4px}
.pretest-q .ps{font-size:12px; color:var(--text-3); margin-bottom:14px}

/* Pomodoro / Session-Timer */
.session-bar{
  position:fixed; bottom:74px; right:14px; z-index:50;
  padding:6px 10px; border-radius:99px; font-size:12px;
  background:rgba(20,12,40,.85); color:var(--text-2); backdrop-filter:blur(6px);
  border:1px solid var(--border-strong); display:none;
}
.session-bar.show{display:block}
.session-bar .dot{display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--good); margin-right:6px; animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:.6} 50%{opacity:1}}

/* Story / CI rendering */
.story-para{padding:10px 14px; margin:6px 0; border-radius:10px; background:var(--surface-2); line-height:1.6; cursor:pointer}
.story-para:hover{background:var(--surface-3)}
.story-para .sr{font-weight:600}
.story-para .de{display:none; font-size:13px; color:var(--text-3); margin-top:6px; padding-top:6px; border-top:1px dashed var(--border)}
.story-para.show-de .de{display:block}

/* Chunk-Card */
.chunk-card{padding:14px; border-radius:12px; background:var(--surface); border:1px solid var(--border); margin-bottom:8px}
.chunk-card .chunk-sr{font-size:18px; font-weight:600}
.chunk-card .chunk-de{font-size:13px; color:var(--text-3); margin-top:2px}
.chunk-card .chunk-cat{display:inline-block; font-size:10px; padding:2px 8px; border-radius:99px; background:var(--surface-3); color:var(--text-3); margin-top:6px}

/* === Vereinfachung 2026: Ein-Tap-Home & Quick-Session === */
.home-simple{max-width:480px; margin:0 auto; padding:14px 0 50px; text-align:center}
.hs-greet{font-size:22px; font-weight:800; letter-spacing:-.01em; margin-top:8px}
.hs-chips{display:flex; gap:8px; justify-content:center; margin-top:12px}
.min-ring-wrap{display:grid; place-items:center; margin:30px 0 16px}
.ring.big .ring-content b{font-size:48px; font-weight:900}
.ring.big .ring-content small{font-size:12px; margin-top:7px; letter-spacing:.04em; text-transform:none}
.hs-status{font-size:15px; color:var(--text-2); margin-bottom:24px}
.hs-status.done{color:var(--good); font-weight:700}
.start-btn{display:flex; flex-direction:column; align-items:center; gap:2px; width:100%;
  padding:22px 18px; border:none; border-radius:var(--r-xl); cursor:pointer;
  background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:#241433;
  box-shadow:var(--glow-accent); transition:transform .14s var(--ease)}
.start-btn:hover{transform:translateY(-2px)}
.start-btn:active{transform:scale(.97)}
.start-btn .sb-ico{font-size:24px; line-height:1}
.start-btn .sb-main{font-size:23px; font-weight:900; letter-spacing:-.01em}
.start-btn .sb-sub{font-size:13px; font-weight:700; opacity:.78}
.hs-slot{margin-top:20px; font-size:13px; color:var(--text-3)}
.hs-slot b{color:var(--text-2)}
.hs-more{display:inline-block; margin-top:22px; color:var(--text-4)}

/* Session-Container */
.session{max-width:560px; margin:0 auto; padding-bottom:40px}
.session-top{display:flex; align-items:center; gap:10px; margin-bottom:22px}
.sess-prog{flex:1; height:9px; background:var(--surface-3); border-radius:99px; overflow:hidden; border:1px solid var(--border)}
.sess-prog i{display:block; height:100%; width:0; border-radius:99px; background:linear-gradient(90deg, var(--good), #3fcf90); transition:width .5s var(--ease-out)}
.sess-min{font-size:12px; color:var(--text-3); white-space:nowrap; font-variant-numeric:tabular-nums}
.sess-combo{font-weight:800; color:var(--accent); white-space:nowrap; font-variant-numeric:tabular-nums; min-width:46px; text-align:right}
.q-prompt{text-align:center; margin:6px 0 26px}
.q-prompt .q-sub{color:var(--text-3); font-size:14px; margin-bottom:8px}
.q-word{font-size:38px; font-weight:900; letter-spacing:-.01em; line-height:1.15}
.opts{display:grid; gap:10px}
.opt{display:flex; align-items:center; width:100%; padding:16px 18px; border-radius:var(--r-md);
  background:var(--surface); border:1.5px solid var(--border); color:var(--text);
  font-size:17px; font-weight:700; cursor:pointer; text-align:left; transition:.12s var(--ease)}
.opt:hover{border-color:var(--border-strong)}
.opt:active{transform:scale(.985)}
.opt.correct{background:rgba(91,229,163,.16); border-color:var(--good); color:var(--good)}
.opt.wrong{background:rgba(255,107,138,.14); border-color:var(--bad); color:var(--bad)}
.opt.dim{opacity:.42}
.sess-fb{text-align:center; margin-top:20px; font-weight:800; font-size:17px; min-height:22px}
.sess-fb.good{color:var(--good)} .sess-fb.bad{color:var(--bad)}
.listen-big{width:104px; height:104px; border-radius:50%; border:none; cursor:pointer; font-size:44px;
  background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:#241433; box-shadow:var(--glow-accent); transition:transform .14s var(--ease)}
.listen-big:active{transform:scale(.94)}
/* Satz bauen */
.tray{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; align-items:center; min-height:56px;
  padding:12px; border:1.5px dashed var(--border); border-radius:var(--r-md); margin-bottom:16px}
.tiles{display:flex; flex-wrap:wrap; gap:8px; justify-content:center}
.wtile{padding:12px 16px; border-radius:12px; background:var(--surface-2); border:1.5px solid var(--border);
  color:var(--text); font-size:17px; font-weight:700; cursor:pointer; transition:.12s var(--ease)}
.wtile:active{transform:scale(.95)}
/* Paare */
.pairs-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.pcell{padding:18px 12px; border-radius:var(--r-md); background:var(--surface); border:1.5px solid var(--border);
  color:var(--text); font-weight:700; font-size:16px; cursor:pointer; text-align:center; transition:.12s var(--ease)}
.pcell.sr{font-family:'Plus Jakarta Sans'}
.pcell.sel{border-color:var(--accent); background:rgba(255,181,71,.12)}
.pcell.matched{opacity:.35; pointer-events:none; border-color:var(--good)}
.pcell.miss{border-color:var(--bad); animation:sess-shake .32s}
@keyframes sess-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
</style>
</head>

function isLessonDoneStatic(s,id){
  const c = s.completed[id];
  if(!c) return false;
  return c.flashcards && (c.quiz||0)>=1 && (c.typing||0)>=1;
}
function checkNewAchievements(){
  state.achievements = state.achievements || [];
  const newly = [];
  for(const a of ACHIEVEMENTS){
    if(state.achievements.includes(a.id)) continue;
    if(a.check(state)){
      state.achievements.push(a.id);
      newly.push(a);
    }
  }
  save();
  return newly;
}

const TO_CYR_MAP = [
  ["Lj","Љ"],["lj","љ"],["Nj","Њ"],["nj","њ"],["Dž","Џ"],["dž","џ"],
  ["A","А"],["a","а"],["B","Б"],["b","б"],["V","В"],["v","в"],
  ["G","Г"],["g","г"],["D","Д"],["d","д"],["Đ","Ђ"],["đ","ђ"],
  ["E","Е"],["e","е"],["Ž","Ж"],["ž","ж"],["Z","З"],["z","з"],
  ["I","И"],["i","и"],["J","Ј"],["j","ј"],["K","К"],["k","к"],
  ["L","Л"],["l","л"],["M","М"],["m","м"],["N","Н"],["n","н"],
  ["O","О"],["o","о"],["P","П"],["p","п"],["R","Р"],["r","р"],
  ["S","С"],["s","с"],["T","Т"],["t","т"],["Ć","Ћ"],["ć","ћ"],
  ["U","У"],["u","у"],["F","Ф"],["f","ф"],["H","Х"],["h","х"],
  ["C","Ц"],["c","ц"],["Č","Ч"],["č","ч"],["Š","Ш"],["š","ш"]
];
function toCyrillic(text){
  let out = text;
  for(const [lat,cyr] of TO_CYR_MAP){
    out = out.split(lat).join(cyr);
  }
  return out;
}
function showText(t){ return state.script === "cyr" ? toCyrillic(t) : t; }

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return structuredClone(defaultState);
    const s = JSON.parse(raw);
    return Object.assign(structuredClone(defaultState), s);
  }catch(e){ return structuredClone(defaultState); }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
let state = load();

/* helpers */
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function dayIdx(){ return Math.floor(Date.now()/86400000); }
function yesterdayStr(){
  const y=new Date(); y.setDate(y.getDate()-1);
  return y.getFullYear()+"-"+(y.getMonth()+1)+"-"+y.getDate();
}

function tickDaily(){
  const t = todayStr();
  if(state.dailyDate !== t){ state.dailyDone = 0; state.dailyDate = t; save(); }
}

/* --- XP & Streak --- */
function awardXP(n,label){
  state.xp += n;
  state.lastDate = todayStr();
  state.dailyDone += n;
  state.activity[todayStr()] = (state.activity[todayStr()]||0) + n;
  if(state.xp >= 200 && state.unlockedLevel<2) { state.unlockedLevel = 2; toastAch("🥈","Level 2 freigeschaltet"); }
  if(state.xp >= 600 && state.unlockedLevel<3) { state.unlockedLevel = 3; toastAch("🥇","Level 3 freigeschaltet"); }
  save();
  updateHeader();
  if(label) toast(`+${n} XP · ${label}`,"good");
  const newly = checkNewAchievements();
  for(const a of newly){
    setTimeout(()=>{ toastAch(a.icon, a.title); confettiBurst(); }, 700);
  }
}
function bumpStreak(){
  const t = todayStr(), y = yesterdayStr();
  if(state.lastSetDate === t) return;            // schon heute gestreakt
  if(state.lastSetDate === y) state.streak++;
  else state.streak = 1;
  state.lastSetDate = t;
  save();
}
function markLesson(id,mode,value){
  state.completed[id] = state.completed[id] || {};
  state.completed[id][mode] = value;
  save();
}
function isLessonDone(id){
  const c = state.completed[id];
  if(!c) return false;
  return c.flashcards && (c.quiz||0)>=1 && (c.typing||0)>=1;
}

/* --- TTS --- */
let _voicesCache = null;
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  _voicesCache = vs;
  if(state.voiceName){
    const exact = vs.find(v=>v.name===state.voiceName);
    if(exact) return exact;
  }
  return vs.find(v=>/sr|hr|bs/i.test(v.lang)) || null;
}
function speak(text, opts){
  if(!("speechSynthesis" in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "sr-RS";
  u.rate = (opts && opts.rate) || .88;
  const v = pickVoice();
  if(v) u.voice = v;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}
function getVoices(){ return _voicesCache || speechSynthesis.getVoices(); }

   Replaces SM-2 (~+20-30% retention bei gleicher Anzahl Reviews,
   Benchmark v.s. SM-2: bessere log-loss in 99,5% Collections).
   Mapping unsere q-Skala (Again=0, Hard=3, Good=4, Easy=5)
                      → FSRS rating (1=Again, 2=Hard, 3=Good, 4=Easy).
   Backward-kompatibel: alte state.srs wird beim Lesen migriert.
   Quelle: github.com/open-spaced-repetition/free-spaced-repetition-scheduler */
const FSRS_W_DEFAULT = [
  0.4072, 1.1829, 3.1262, 15.4722,   // init S nach Rating 1..4
  7.2102, 0.5316, 1.0651, 0.0234,    // D-Anker, D-Update
  1.616,  0.1544, 1.0824, 1.9813,    // Stability success
  0.0953, 0.2975, 2.2042, 0.2407,    // Stability success cont.
  2.9466, 0.5034, 0.6567             // Stability fail
];
const FSRS_DECAY = -0.5;
const FSRS_FACTOR = Math.pow(0.9, 1/FSRS_DECAY) - 1;  // ≈0.04643... (RetReq 0.9)
function fsrsW(){ return state.fsrsParams || FSRS_W_DEFAULT; }
function _qToRating(q){ return q<=0?1 : q<=3?2 : q<=4?3 : 4; } // unsere Buttons → FSRS
function fsrsRetrievability(S, daysElapsed){
  // R = (1 + FACTOR*t/S)^DECAY
  if(S<=0) return 0;
  return Math.pow(1 + FSRS_FACTOR * daysElapsed / S, FSRS_DECAY);
}
function _initStability(rating){
  const w = fsrsW();
  return Math.max(0.1, w[rating-1]);
}
function _initDifficulty(rating){
  const w = fsrsW();
  // D_0(g) = w4 - exp(w5*(g-1)) + 1, clamped to [1,10]
  const d = w[4] - Math.exp(w[5]*(rating-1)) + 1;
  return Math.min(10, Math.max(1, d));
}
function _nextDifficulty(D, rating){
  const w = fsrsW();
  // Linear-shift Schritt + Mean-Reversion zur D_0(4)
  const dDelta = -w[6] * (rating - 3);
  const dPrime = D + dDelta * (10 - D) / 9;
  const target = _initDifficulty(4);
  return Math.min(10, Math.max(1, w[7]*target + (1-w[7])*dPrime));
}
function _nextStabilitySuccess(D, S, R, rating){
  const w = fsrsW();
  const hardPenalty = rating === 2 ? w[15] : 1;
  const easyBonus   = rating === 4 ? w[16] : 1;
  return S * (1 + Math.exp(w[8]) * (11 - D) *
              Math.pow(S, -w[9]) *
              (Math.exp((1 - R) * w[10]) - 1) *
              hardPenalty * easyBonus);
}
function _nextStabilityFail(D, S, R){
  const w = fsrsW();
  const sf = w[11] * Math.pow(D, -w[12]) *
             (Math.pow(S + 1, w[13]) - 1) *
             Math.exp((1 - R) * w[14]);
  // Min(neue S, alte S) — Stability darf bei Fail nicht steigen
  return Math.min(sf, S);
}
function _interval(S, retentionTarget){
  const target = retentionTarget || 0.9;
  // i = (S/FACTOR) * (target^(1/DECAY) - 1)
  const ivl = (S / FSRS_FACTOR) * (Math.pow(target, 1/FSRS_DECAY) - 1);
  return Math.max(1, Math.round(ivl));
}
function _migrateSm2ToFsrs(sm2){
  // alte SM-2 (ef, ivl, reps, due) → grobe FSRS-Karte
  const reps = sm2.reps || 0;
  const D = Math.min(10, Math.max(1, 11 - (sm2.ef||2.5)*2));
  const S = Math.max(0.5, (sm2.ivl||1));
  return { S, D, due: sm2.due || dayIdx(), reps, lapses:0,
           lastReview: dayIdx() - (sm2.ivl||0), lastQ: reps>0?3:1, _migrated:true };
}
function fsrsGet(sr){
  if(state.fsrs[sr]) return state.fsrs[sr];
  if(state.srs[sr]){
    const m = _migrateSm2ToFsrs(state.srs[sr]);
    state.fsrs[sr] = m;
    return m;
  }
  return null;
}
function srsRecord(sr, q){
  const today = dayIdx();
  const rating = _qToRating(q);
  let s = fsrsGet(sr);
  if(!s){
    s = { S:_initStability(rating), D:_initDifficulty(rating),
          due: today, reps: rating>=2?1:0, lapses: rating===1?1:0,
          lastReview: today, lastQ: rating };
  } else {
    const elapsed = Math.max(0, today - (s.lastReview ?? today));
    const R = elapsed === 0 ? 1 : fsrsRetrievability(s.S, elapsed);
    if(rating === 1){
      s.S = _nextStabilityFail(s.D, s.S, R);
      s.lapses = (s.lapses||0) + 1;
      s.reps = 0; // Lapse
    } else {
      s.S = _nextStabilitySuccess(s.D, s.S, R, rating);
      s.reps = (s.reps||0) + 1;
    }
    s.D = _nextDifficulty(s.D, rating);
    s.lastReview = today;
    s.lastQ = rating;
  }
  // Stability sanity-clamps
  s.S = Math.min(36500, Math.max(0.1, s.S));
  s.D = Math.min(10, Math.max(1, s.D));
  s.due = today + _interval(s.S);
  state.fsrs[sr] = s;
  // Spiegel in altem state.srs (für Achievements / Coverage / Heatmap)
  state.srs[sr] = { ef: 1.3 + (10-s.D)*0.13, ivl: s.due - today,
                    reps: s.reps, due: s.due };
}
function srsDueWords(){
  const today = dayIdx();
  const all = [];
  for(const k of Object.keys(LESSONS)){
    if(parseInt(k) > state.unlockedLevel) continue;
    for(const les of LESSONS[k].lessons) all.push(...les.vocab);
  }
  for(const w of TOP_WORDS) if(state.fsrs[w.sr] || state.srs[w.sr]) all.push(w);
  const seen=new Set(), dedup=[];
  for(const w of all){ if(seen.has(w.sr)) continue; seen.add(w.sr); dedup.push(w); }
  return dedup.filter(w=>{
    const s = state.fsrs[w.sr] || state.srs[w.sr];
    return !s || s.due <= today;
  });
}
function srsDueCount(){
  const t = dayIdx(); let n=0; const seen=new Set();
  for(const k of Object.keys(state.fsrs)){ if(state.fsrs[k].due<=t){ n++; seen.add(k); } }
  for(const k of Object.keys(state.srs))  if(!seen.has(k) && state.srs[k].due<=t) n++;
  return n;
}
/* Forecast: nächste 7 Tage (für Coverage-Tab, motivierende Vorschau) */
function srsForecast(days){
  const out = new Array(days).fill(0);
  const t = dayIdx();
  for(const k of Object.keys(state.fsrs)){
    const d = state.fsrs[k].due - t;
    if(d>=0 && d<days) out[d]++;
  }
  return out;
}

/* === Coverage-Tracker (Nation 2001) ===
   Welcher Anteil der Top-1000 ist „bekannt" (mind. 2 erfolgreiche Reviews
   ODER reps>=2 in altem state.srs)?  Anzeige in Home & Profile. */
function isWordKnown(sr){
  const f = state.fsrs[sr];
  if(f) return f.reps >= 2 && f.lapses < 2;
  const s = state.srs[sr];
  return s && s.reps >= 2;
}
function coverageStats(){
  const N = TOP_WORDS.length || 1;
  let known = 0;
  for(const w of TOP_WORDS) if(isWordKnown(w.sr)) known++;
  // Pareto-Schätzung (Nation 2013, gesprochenes Englisch ~80%; sprachübergreifend 75-85%)
  const coveragePct = Math.round(known / N * 80);
  const totalKnown = Object.keys(state.fsrs)
    .filter(k => state.fsrs[k].reps >= 2 && state.fsrs[k].lapses < 2).length;
  const dueNow = srsDueCount();
  const matureCards = Object.values(state.fsrs).filter(c=>c.S >= 21).length; // 3+ Wochen Stability
  const youngCards  = Object.values(state.fsrs).filter(c=>c.S < 21 && c.reps>0).length;
  return { knownTop:known, totalTop:N, coveragePct, totalKnown, dueNow, matureCards, youngCards };
}

/* === Chunk-SRS (parallel zu Wort-SRS, gleiche Engine) === */
function chunkRecord(id, q){
  const today = dayIdx();
  const rating = _qToRating(q);
  let s = state.chunkSrs[id];
  if(!s){
    s = { S:_initStability(rating), D:_initDifficulty(rating),
          due: today, reps: rating>=2?1:0, lapses: rating===1?1:0,
          lastReview: today, lastQ: rating };
  } else {
    const elapsed = Math.max(0, today - (s.lastReview||today));
    const R = elapsed===0 ? 1 : fsrsRetrievability(s.S, elapsed);
    if(rating===1){
      s.S = _nextStabilityFail(s.D, s.S, R); s.lapses++; s.reps=0;
    } else {
      s.S = _nextStabilitySuccess(s.D, s.S, R, rating); s.reps++;
    }
    s.D = _nextDifficulty(s.D, rating);
    s.lastReview = today; s.lastQ = rating;
  }
  s.S = Math.min(36500, Math.max(0.1, s.S));
  s.D = Math.min(10, Math.max(1, s.D));
  s.due = today + _interval(s.S);
  state.chunkSrs[id] = s;
  state.chunksDone[id] = (state.chunksDone[id]||0) + (rating>=3?1:0);
}
function chunksDueCount(){
  const t = dayIdx(); let n = 0;
  for(const c of CHUNKS){
    const s = state.chunkSrs[c.id];
    if(!s || s.due <= t) n++;
  }
  return n;
}

function sessionStart(){

}
function sessionMinsElapsed(){
  if(!state.sessionStart) return 0;
  return Math.floor((Date.now() - state.sessionStart) / 60000);
}
function sessionResetIfStale(){
  // Pause > 5 min → Session frisch
  if(!state.sessionStart) return;
  const last = state._lastTouch || state.sessionStart;
  if(Date.now() - last > 5*60*1000){ state.sessionStart = Date.now(); state.pomodoroBreaks = 0; }
}
function pomodoroCheck(){
  if(!state.pomodoroMin) return;
  sessionResetIfStale();
  state._lastTouch = Date.now();
  sessionStart();
  const mins = sessionMinsElapsed();
  const breaks = state.pomodoroBreaks || 0;
  const dueAt = state.pomodoroMin * (breaks + 1);
  if(mins >= dueAt){
    state.pomodoroBreaks = breaks + 1;
    save();
    toast(`🍅 ${state.pomodoroMin} Min voll · gönn dir 5 Min Pause`, "good");
  }
}

/* === Noticing-Highlight: Endungen markieren (Schmidt 1990) ===
   Hebt typische Fall-/Genus-Endungen in serbischen Wörtern hervor.
   Fokus auf Anfänger-Fälle: Akk fem -u, Lok/Dat -i/-u, Pl -i, Verb-3sg -e/-i. */
const NOTICING_SUFFIXES = [
  /(om|em)\b/g,    // Instr m/n
  /(ima|ama)\b/g,  // Pl Dat/Loc/Instr
  /(ima|ama)\b/g,
  /(ova|eva)\b/g,  // Pl
  /\b(ne|ni|ni\?)\b/g
];
function highlightNoticing(text){
  if(!state.noticingOn) return text;
  // Kennzeichne typische Endungen mit dezenter Unterstreichung
  const patterns = [
    [/([a-zčćšžđA-ZČĆŠŽĐ]{3,}?)(om|em|im|am)\b/g, "$1<u class=\"nc\">$2</u>"],   // Instrumental
    [/([a-zčćšžđA-ZČĆŠŽĐ]{3,}?)(ima|ama)\b/g,    "$1<u class=\"nc nc-2\">$2</u>"], // Pluralfälle
    [/([a-zčćšžđA-ZČĆŠŽĐ]{2,}?)(u)\b/g,           "$1<u class=\"nc nc-3\">$2</u>"], // Akk fem-Sg
    [/([a-zčćšžđA-ZČĆŠŽĐ]{2,}?)(i)\b/g,           "$1<u class=\"nc nc-4\">$2</u>"]  // Lok / Pl-m
  ];
  let out = text;
  for(const [re, rep] of patterns) out = out.replace(re, rep);
  return out;
}

/* --- Levenshtein / similarity / normalize --- */
function normalize(s){
  return s.toLowerCase().trim()
    .replace(/đ/g,"dj").replace(/ć/g,"c").replace(/č/g,"c")
    .replace(/š/g,"s").replace(/ž/g,"z")
    .replace(/[^a-z0-9 ]/g,"");
}
function levenshtein(a,b){
  const m=a.length, n=b.length;
  if(!m) return n; if(!n) return m;
  const dp = Array.from({length:m+1}, ()=>new Array(n+1).fill(0));
  for(let i=0;i<=m;i++) dp[i][0]=i;
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++){
    dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
  }
  return dp[m][n];
}
function similarity(a,b){
  const an=normalize(a), bn=normalize(b);
  if(!an||!bn) return 0;
  const d = levenshtein(an,bn);
  return Math.max(0, 1 - d/Math.max(an.length,bn.length));
}

/* --- Speech Recognition --- */
function speechAvailable(){ return !!(window.SpeechRecognition||window.webkitSpeechRecognition); }
function startListening(onResult, onError){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ onError("Browser unterstützt keine Spracherkennung. Nutze Chrome oder Safari."); return null; }
  const r = new SR();
  r.lang="sr-RS"; r.interimResults=false; r.maxAlternatives=5; r.continuous=false;
  r.onresult = e => {
    const alts=[]; const res=e.results[0];
    for(let i=0;i<res.length;i++) alts.push(res[i].transcript);
    onResult(alts);
  };
  r.onerror = e => {
    let m = e.error || "unbekannter Fehler";
    if(m==="not-allowed") m="Mikrofon-Zugriff verweigert. In Browser-Einstellungen erlauben.";
    if(m==="no-speech") m="Nichts gehört — bitte deutlicher sprechen.";
    if(m==="language-not-supported") m="Serbisch (sr-RS) wird nicht unterstützt. Versuch's in Chrome.";
    onError(m);
  };
  try { r.start(); } catch(e){ onError("Aufnahme fehlgeschlagen: "+e.message); return null; }
  return r;
}

/* --- Mini Sound-FX (WebAudio) --- */
let _ac = null;
function ac(){ if(!_ac && window.AudioContext) _ac = new AudioContext(); return _ac; }
function bleep(freq, dur, type){
  if(!state.soundOn) return;
  const c = ac(); if(!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type||"sine"; o.frequency.value = freq;
  g.gain.value = 0.001;
  g.gain.exponentialRampToValueAtTime(0.16, c.currentTime+0.005);
  g.gain.exponentialRampToValueAtTime(0.001, c.currentTime+dur);
  o.connect(g); g.connect(c.destination);
  o.start(); o.stop(c.currentTime + dur);
}
function sfx(name){
  if(!state.soundOn) return;
  if(name==="ok"){ bleep(660,0.10,"triangle"); setTimeout(()=>bleep(880,0.12,"triangle"),60); }
  else if(name==="bad"){ bleep(180,0.18,"sawtooth"); }
  else if(name==="tick"){ bleep(520,0.04,"square"); }
  else if(name==="win"){ bleep(523,0.10); setTimeout(()=>bleep(659,0.10),100); setTimeout(()=>bleep(784,0.18),200); setTimeout(()=>bleep(1047,0.22),300); }
}

/* --- Toast / Confetti --- */
let _toastTimer = null;
function toast(msg, kind){
  let el = document.getElementById("toast-el");
  if(!el){ el = document.createElement("div"); el.id="toast-el"; el.className="toast"; document.body.appendChild(el); }
  el.className = "toast" + (kind?" "+kind:"");
  el.textContent = msg;
  requestAnimationFrame(()=>el.classList.add("show"));
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(()=>el.classList.remove("show"), 2000);
}
function toastAch(icon,title){
  const el = document.createElement("div");
  el.className = "toast ach show";
  el.innerHTML = `<span style="font-size:20px">${icon}</span> <span>${title}</span>`;
  document.body.appendChild(el);

}
function confettiBurst(){
  const cv = document.getElementById("confetti-canvas");
  cv.width = innerWidth; cv.height = innerHeight;
  const ctx = cv.getContext("2d");
  const colors = ["#ffb547","#ff7a5c","#c84d6a","#5be5a3","#7fa8ff","#ffd56b"];
  const N = 110;
  const particles = [];
  for(let i=0;i<N;i++){
    particles.push({
      x: innerWidth/2 + (Math.random()-.5)*60,
      y: innerHeight/3,
      vx: (Math.random()-.5)*8,
      vy: -Math.random()*8 - 4,
      g: 0.18 + Math.random()*0.1,
      s: 5 + Math.random()*5,
      c: colors[Math.floor(Math.random()*colors.length)],
      r: Math.random()*Math.PI*2,
      vr: (Math.random()-.5)*0.25,
      a: 1
    });
  }
  let frames = 0;
  function step(){
    frames++;
    ctx.clearRect(0,0,cv.width,cv.height);
    for(const p of particles){
      p.vy += p.g; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      p.a *= 0.992;
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.globalAlpha = p.a;
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6);
      ctx.restore();
    }
    if(frames < 220) requestAnimationFrame(step);
    else ctx.clearRect(0,0,cv.width,cv.height);
  }
  requestAnimationFrame(step);
}

function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

  if(v.type==="preTest")       return renderPreTest(v.level, v.lessonId);

  if(v.type==="chunks")        return renderChunksTab();
  if(v.type==="chunkReview")   return renderChunkReview();
  if(v.type==="stories")       return renderStoriesList();
  if(v.type==="storyRead")     return renderStoryRead(v.id);
  if(v.type==="coverage")      return renderCoverage();
  if(v.type==="methodik")      return renderMethodik();
  // tabs
  if(state.view.tab === "more") return renderMoreTab();
  if(state.view.tab === "learn") return renderLearnTab();
  if(state.view.tab === "practice") return renderPracticeTab();
  if(state.view.tab === "dialogues") return renderDialoguesTab();
  if(state.view.tab === "profile") return renderProfileTab();
  return renderHomeTab();
}

let fcState = null;
function renderFlashcards(level, lessonId){
  pomodoroCheck();

  if(!fcState || fcState.lessonId !== lessonId){
    fcState = { lessonId, deck: shuffle([...les.vocab]), idx:0, flipped:false, finished:false,
                recallStage: state.preRecallEnabled ? "ask" : "show",
                recallVal:"", recallSelf:null };
  }
  if(fcState.idx >= fcState.deck.length){
    if(!fcState.finished){
      fcState.finished = true;
      markLesson(lessonId,"flashcards", true);
      awardXP(15, `Karten · ${les.title}`);
      sfx("win");
    }
    $("#app").innerHTML = `
      ${detailHead("Karteikarten", `setView({type:'lesson', level:${level}, lessonId:'${lessonId}'})`)}
      <div class="card elev center" style="padding:36px">
        <div style="font-size:54px">🎴</div>
        <h1 style="margin-top:8px">Alle Karten durch!</h1>
        <p class="muted" style="margin:8px 0 18px">+15 XP · Lektion „${les.title}"</p>
        <div class="row" style="justify-content:center; gap:8px; flex-wrap:wrap">
          <button onclick="fcState=null; render()">↻ Nochmal</button>
          <button class="primary" onclick="setView({type:'quiz', level:${level}, lessonId:'${lessonId}'})">Weiter zum Quiz →</button>
        </div>
      </div>`;
    return;
  }
  const w = fcState.deck[fcState.idx];
  const flipped = fcState.flipped;
  const mnem = MNEMONICS[w.sr];
  $("#app").innerHTML = `
    ${detailHead("Karteikarten · " + les.title, `setView({type:'lesson', level:${level}, lessonId:'${lessonId}'})`)}
    <div class="flashcard-counter">
      <span>Karte ${fcState.idx+1} / ${fcState.deck.length}</span>
      <span><span class="kbd">Enter</span> prüfen · <span class="kbd">Space</span> auflösen · <span class="kbd">1-4</span> bewerten</span>
    </div>
    <div class="bar thin" style="margin-bottom:14px"><i style="width:${(fcState.idx/fcState.deck.length)*100}%"></i></div>

    <div class="flashcard-wrap">
      <div class="flashcard ${flipped?'flipped':''}" id="fc" onclick="${flipped?'':'fcFlip()'}">
        <div class="face front">
          <button class="icon-btn play-btn" onclick="event.stopPropagation(); speak('${jsStr(w.sr)}')" aria-label="Aussprache">🔊</button>
          <div class="word">${showText(w.sr)}</div>
          ${w.ipa?`<div class="ipa">[${w.ipa}]</div>`:""}
          <div class="hint">${state.preRecallEnabled?'Antwort denken oder eintippen':'Tippen oder Space zum Umdrehen'}</div>
        </div>
        <div class="face back">
          <div class="muted tiny" style="margin-bottom:8px; letter-spacing:.08em; text-transform:uppercase">Übersetzung</div>
          <div class="word">${w.de}</div>
          ${w.note?`<div class="note">${w.note}</div>`:""}
          ${mnem?`<div class="mnem-box"><b>💡 Eselsbrücke (Atkinson 1975):</b> ${mnem}</div>`:""}
          <div class="hint">Wie gut wusstest du das?</div>
        </div>
      </div>
    </div>

    ${!flipped && state.preRecallEnabled ? `
      <div class="recall-box">
        <label>Was bedeutet das? (Active Recall — Roediger & Karpicke)</label>
        <input id="fcRecall" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"
               value="${jsStr(fcState.recallVal||'')}" placeholder="Tippen oder einfach denken — drücke Enter">
        <div class="recall-hint">Aktives Abrufen festigt 2–3× besser als Re-Reading. ${scienceLink('recall')}</div>
        <button class="recall-skip" onclick="fcSkipRecall()">Nur denken — direkt auflösen</button>
      </div>
    ` : ''}

    ${flipped ? `
      <div class="qrow">
        <button class="q-again" onclick="fcAnswer(0)"><span class="ql">Nochmal</span><span class="qs">&lt; 1 min</span></button>
        <button class="q-hard"  onclick="fcAnswer(3)"><span class="ql">Schwer</span><span class="qs">~10 min</span></button>
        <button class="q-good"  onclick="fcAnswer(4)"><span class="ql">Gut</span><span class="qs">~1 Tag</span></button>
        <button class="q-easy"  onclick="fcAnswer(5)"><span class="ql">Easy</span><span class="qs">~4 Tage</span></button>
      </div>
    ` : (!state.preRecallEnabled ? `
      <div class="row" style="justify-content:center; margin-top:14px">
        <button class="primary lg" onclick="fcFlip()">Auflösen</button>
      </div>
    ` : '')}
  `;
  // Recall-Input fokussieren
  if(!flipped && state.preRecallEnabled){
    setTimeout(()=>{
      const el = document.getElementById("fcRecall");
      if(!el) return;
      el.focus();
      el.addEventListener("input", e=>{ fcState.recallVal = e.target.value; });
      el.addEventListener("keydown", e=>{
        if(e.key === "Enter"){ e.preventDefault(); fcCheckRecall(); }
        else if(e.key === " " && el.value === ""){ e.preventDefault(); fcSkipRecall(); }
      });
    }, 50);
  }
}
function fcCheckRecall(){
  if(!fcState) return;
  const w = fcState.deck[fcState.idx];
  const a = normalize(fcState.recallVal||"");
  const b = normalize(w.de);
  const sim = similarity(a, b);
  fcState.recallSelf = sim >= 0.65 ? "ok" : (sim >= 0.4 ? "close" : "miss");
  fcFlip();
  setTimeout(()=>{
    if(fcState.recallSelf === "ok")    toast("✓ Aktiv abgerufen — starker Eintrag", "good");
    else if(fcState.recallSelf === "close") toast("≈ Fast — zähle als Schwer", "good");
    else toast("Nicht gewusst — Gehirn merkt sich das jetzt besser", "bad");
  }, 100);
}
function fcSkipRecall(){
  if(!fcState) return;
  fcState.recallSelf = "skipped";
  fcFlip();
}
function fcFlip(){ fcState.flipped = !fcState.flipped; render(); }
function fcAnswer(q){
  const w = fcState.deck[fcState.idx];
  // Active-Recall verschiebt q leicht: wer beim Pre-Recall traf, soll nicht „Nochmal" wählen
  let qFinal = q;
  if(fcState.recallSelf === "ok" && q < 4) qFinal = 4;
  if(fcState.recallSelf === "miss" && q > 3) qFinal = 3; // ehrliche Korrektur
  srsRecord(w.sr, qFinal);
  if(qFinal>=4) sfx("ok"); else if(qFinal<3) sfx("bad");
  fcState.idx++;
  fcState.flipped = false;
  fcState.recallVal = "";
  fcState.recallSelf = null;
  save();
  render();
}

   =========================================================== */
let qzState = null;
function renderQuiz(level, lessonId){
  const les = findLesson(level, lessonId);
  if(!qzState || qzState.lessonId !== lessonId){
    const deck = pickN(les.vocab, Math.min(8, les.vocab.length));
    const allDe = LESSONS[level].lessons.flatMap(l=>l.vocab.map(v=>v.de));
    qzState = { lessonId, deck, idx:0, score:0, allDe, picked:null, correct:null, isDone:false };
  }
  if(qzState.idx >= qzState.deck.length){
    if(!qzState.isDone){
      qzState.isDone = true;
      const passed = qzState.score >= Math.ceil(qzState.deck.length*0.6);
      if(passed){
        markLesson(lessonId,"quiz", (state.completed[lessonId]?.quiz||0)+1);
        awardXP(20, `Quiz · ${qzState.score}/${qzState.deck.length}`);
        sfx("win");
      } else { sfx("bad"); }
    }

  }
  const q = qzState.deck[qzState.idx];
  if(qzState.correct === null){
    const distractors = shuffle(qzState.allDe.filter(d=>d!==q.de)).slice(0,3);
    qzState.options = shuffle([q.de, ...distractors]);
  }
  $("#app").innerHTML = `

    <div class="row between" style="margin-bottom:8px"><span class="muted tiny">Frage ${qzState.idx+1}/${qzState.deck.length}</span><span class="muted tiny">${qzState.score} ✓</span></div>

      ${qzState.options.map((o,i) => {
        let cls = "";
        if(qzState.picked !== null){
          if(o === q.de) cls = "correct";
          else if(o === qzState.picked) cls = "wrong";
        }
        return `<button class="${cls}" onclick="qzPick('${jsStr(o)}')" ${qzState.picked!==null?'disabled':''}><span class="num">${i+1}</span>${o}</button>`;
      }).join("")}

    ${qzState.picked !== null ? `

        <button class="primary lg" onclick="qzNext()">Weiter →</button>

}
function qzPick(opt){
  const q = qzState.deck[qzState.idx];
  qzState.picked = opt;
  qzState.correct = (opt === q.de);
  if(qzState.correct){ qzState.score++; sfx("ok"); }
  else sfx("bad");
  render();
}
function qzNext(){
  qzState.idx++; qzState.picked = null; qzState.correct = null;
  render();
}

      if(passed){

    }

    $("#app").innerHTML = `

      <div class="card elev center" style="padding:36px">
        <div style="font-size:54px">${passed?"⌨️":"💪"}</div>
