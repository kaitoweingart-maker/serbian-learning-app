        </div>
      </div>`;
    return;
  }
  const w = tyState.deck[tyState.idx];
  const isWrong = tyState.state === "wrong", isOk = tyState.state === "ok";
  const cls = isOk?"correct":(isWrong?"wrong":"");
  $("#app").innerHTML = `
    ${detailHead("Tippen · " + les.title, `setView({type:'lesson', level:${level}, lessonId:'${lessonId}'})`)}
    <div class="row between" style="margin-bottom:8px"><span class="muted tiny">Wort ${tyState.idx+1}/${tyState.deck.length}</span><span class="muted tiny">${tyState.score} ✓</span></div>
    <div class="bar thin" style="margin-bottom:18px"><i style="width:${(tyState.idx/tyState.deck.length)*100}%"></i></div>

    <div class="type-prompt">
      <div class="qsub">Tippe auf Serbisch:</div>
      <div class="q" style="margin-top:6px">${w.de}</div>
      ${w.ipa?`<div class="qhint" style="color:var(--good); margin-top:4px">[${w.ipa}]</div>`:""}
    </div>

    <input class="typing-input ${cls}" id="tyinp" value="${jsStr(tyState.val||"")}" placeholder="z. B. ${w.sr.split(" ").map(p=>p[0]+"…").join(" ")}" autocomplete="off" autocapitalize="off" autocorrect="off" />

    <div class="row" style="justify-content:space-between; margin-top:14px; gap:8px">
      <button class="ghost" onclick="tySkip()">⏭ Überspringen</button>
      ${isOk||isWrong ? `
        <div class="row" style="gap:8px"><button onclick="speak('${jsStr(w.sr)}')">🔊</button><button class="primary" onclick="tyNext()">Weiter →</button></div>
      ` : `
        <button class="primary" onclick="tyCheck()">Prüfen</button>
      `}
    </div>

    ${isWrong?`<div class="card" style="margin-top:14px; border-color:rgba(255,107,138,.3)"><b>Richtig wäre:</b> ${showText(w.sr)} <button class="icon-btn play" style="margin-left:8px" onclick="speak('${jsStr(w.sr)}')">🔊</button></div>`:""}
    ${isOk?`<div class="card" style="margin-top:14px; border-color:rgba(91,229,163,.4); color:var(--good)">✓ Stimmt! ${showText(w.sr)}</div>`:""}
  `;
  setTimeout(()=>{
    const ip = document.getElementById("tyinp");
    if(!ip) return;
    ip.focus(); ip.addEventListener("input", e=>tyState.val = e.target.value);
    ip.addEventListener("keydown", e=>{
      if(e.key==="Enter"){ if(isOk||isWrong) tyNext(); else tyCheck(); }
    });
  }, 30);
}
function tyCheck(){
  const w = tyState.deck[tyState.idx];
  const sim = similarity(tyState.val||"", w.sr);
  if(sim >= 0.8){ tyState.state="ok"; tyState.score++; sfx("ok"); }
  else { tyState.state="wrong"; sfx("bad"); }
  render();
}
function tyNext(){
  tyState.idx++; tyState.val=""; tyState.state="input"; render();
}
function tySkip(){ tyState.idx++; tyState.val=""; tyState.state="input"; render(); }

/* ===========================================================
   BUILDER — Tokens zu Satz
   =========================================================== */
let bldState = null;
function renderBuilder(level, lessonId){
  const les = findLesson(level, lessonId);
  if(!bldState || bldState.lessonId !== lessonId){
    const sentence = les.sentences ? les.sentences[Math.floor(Math.random()*les.sentences.length)] : null;
    if(!sentence){
      $("#app").innerHTML = detailHead("Satz bauen", `setView({type:'lesson', level:${level}, lessonId:'${lessonId}'})`) + `<div class="card center" style="padding:30px">Keine Beispielsätze für diese Lektion.</div>`;
      return;
    }
    const correct = sentence.sr.replace(/[.,!?…]/g,"").split(/\s+/);
    bldState = { lessonId, sentence, correct, placed:[], bank: shuffle(correct), used:Array(correct.length).fill(false), shake:false, finished:false };
  }
  const s = bldState;
  $("#app").innerHTML = `
    ${detailHead("Satz bauen · " + les.title, `setView({type:'lesson', level:${level}, lessonId:'${lessonId}'})`)}

    <div class="quiz-prompt">
      <div class="qsub">Bau diesen Satz auf Serbisch:</div>
      <div class="q" style="font-size:22px; margin-top:8px">${s.sentence.de}</div>
    </div>

    <div class="builder-slots ${s.shake?'shake':''}">
      ${s.placed.length===0?'<span class="muted tiny">Tippe Wörter unten an</span>':s.placed.map((p,i)=>`<button class="token placed" onclick="bldUnplace(${i})">${p}</button>`).join("")}
    </div>
    <div class="builder-bank">
      ${s.bank.map((b,i)=>`<button class="token ${s.used[i]?'used':''}" onclick="bldPlace(${i})">${b}</button>`).join("")}
    </div>

    <div class="row" style="justify-content:space-between; margin-top:10px">
      <button class="ghost" onclick="bldReset()">↻ Zurücksetzen</button>
      <button class="primary" onclick="bldCheck()" ${s.placed.length!==s.correct.length?'disabled':''}>Prüfen</button>
    </div>
  `;
}
function bldPlace(i){
  if(bldState.used[i]) return;
  bldState.placed.push(bldState.bank[i]);
  bldState.used[i] = true;
  render();
}
function bldUnplace(idx){
  const word = bldState.placed[idx];
  bldState.placed.splice(idx,1);
  const fIdx = bldState.bank.findIndex((w,i)=>w===word && bldState.used[i]);
  if(fIdx>=0) bldState.used[fIdx] = false;
  render();
}
function bldReset(){ bldState.placed=[]; bldState.used=bldState.used.map(()=>false); render(); }
function bldCheck(){
  const ok = bldState.placed.join(" ").toLowerCase() === bldState.correct.join(" ").toLowerCase();
  if(ok){
    if(!bldState.finished){
      bldState.finished = true;
      markLesson(bldState.lessonId, "builder", (state.completed[bldState.lessonId]?.builder||0)+1);
      awardXP(20, "Satz gebaut!");
      sfx("win"); confettiBurst();
    }
    setTimeout(()=>{ speak(bldState.sentence.sr); }, 200);
    toast("✓ Perfekt gebaut!","good");
  } else {
    bldState.shake = true; sfx("bad");
    setTimeout(()=>{ bldState.shake=false; render(); }, 350);
    toast("Nicht ganz – versuch's nochmal","bad");
  }
  render();
}

    <div class="card center" style="padding:24px">
      <div class="target-de">Sag auf Serbisch:</div>
      <div class="target-word">${showText(w.sr)}</div>
      <div class="muted tiny" style="margin-bottom:6px">${w.de}${w.ipa?` · <span style="color:var(--good)">[${w.ipa}]</span>`:""}</div>

          ${spkState.listening?"🎙️ Höre zu …":"🎙️ Aufnehmen"}
        </button>
      </div>
      ${spkState.listening?`<div class="wave"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>`:""}
      ${spkState.result?renderSpkResultHTML():""}
    </div>

    <div class="row" style="justify-content:space-between; margin-top:14px">
      <button class="ghost" onclick="spkSkip()">⏭ Überspringen</button>
      <button class="primary" ${spkState.result?'':'disabled'} onclick="spkNext()">Weiter →</button>
    </div>
  `;
}
function renderSpkResultHTML(){
  const r = spkState.result;
  const score = Math.round(r.score*100);
  const cls = r.score>=.85?"good":r.score>=.6?"meh":"bad";
  const w = spkState.deck[spkState.idx];
  return `
    <div class="speech-result ${cls}">
      <div class="row between center"><b>${r.score>=.85?"🎉 Sauber!":r.score>=.6?"🙂 Fast":"😅 Nochmal probieren"}</b><span>${score}%</span></div>
      <div class="speech-meter"><i style="width:${score}%; background:var(--${cls==="good"?"good":cls==="meh"?"warn":"bad"})"></i></div>
      <div class="muted tiny" style="margin-top:6px">Erkannt: „${r.heard}"</div>
      <div class="muted tiny">Soll: „${w.sr}"</div>
    </div>`;
}
function spkToggle(){
  if(spkState.listening) return;
  spkState.listening = true; spkState.result = null;
  render();
  startListening(alts => {
    const w = spkState.deck[spkState.idx];
    const heard = alts[0] || "";
    const score = Math.max(...alts.map(a=>similarity(a, w.sr)));
    spkState.listening = false;
    spkState.result = { heard, score };
    if(score>=.6){ spkState.hits++; sfx("ok"); } else sfx("bad");
    render();
  }, msg => {
    spkState.listening = false; toast(msg,"bad"); render();
  });
}
function spkSkip(){ spkState.idx++; spkState.result=null; render(); }
function spkNext(){ spkState.idx++; spkState.result=null; render(); }

function setSpeakListen(day){
  setSpeakState.listening = true; setSpeakState.result = null;
  render();
  startListening(alts=>{
    const s = getSet(day).speak[setSpeakState.idx];
    const heard = alts[0]||"";
    const score = Math.max(...alts.map(a=>similarity(a, s.sr)));
    setSpeakState.listening=false;
    setSpeakState.result = {heard, score};
    if(score>=.45){ setSpeakState.hits++; sfx("ok"); } else sfx("bad");
    render();
  }, msg => { setSpeakState.listening=false; toast(msg,"bad"); render(); });
}
function setSpeakNext(day){ setSpeakState.idx++; setSpeakState.result=null; render(); }
function setSpeakSkip(day){ setSpeakState.idx++; setSpeakState.result=null; render(); }

/* set-build: token sentence */
let setBuildState = null;
function renderSetBuild(day){
  const set = getSet(day);
  if(!set.build){ markSetModule(day,"buildDone"); setView({type:'todaySet', day}); return; }
  if(!setBuildState || setBuildState.day !== day){
    const correct = set.build.sr.replace(/[.,!?…]/g,"").split(/\s+/);
    setBuildState = { day, sentence:set.build, correct, placed:[], bank:shuffle(correct), used:Array(correct.length).fill(false), shake:false, ok:false };
  }
  const s = setBuildState;
  $("#app").innerHTML = `
    ${detailHead(`Tag ${day} · Satz bauen`, `setView({type:'todaySet', day:${day}})`)}
    <div class="quiz-prompt"><div class="qsub">Auf Serbisch:</div><div class="q" style="font-size:22px">${s.sentence.de}</div></div>
    <div class="builder-slots ${s.shake?'shake':''}">${s.placed.length===0?'<span class="muted tiny">Tippe Wörter unten an</span>':s.placed.map((p,i)=>`<button class="token placed" onclick="setBuildUnplace(${i})">${p}</button>`).join("")}</div>
    <div class="builder-bank">${s.bank.map((b,i)=>`<button class="token ${s.used[i]?'used':''}" onclick="setBuildPlace(${i})">${b}</button>`).join("")}</div>
    <div class="row" style="justify-content:space-between; margin-top:10px">
      <button class="ghost" onclick="setBuildReset()">↻</button>
      <button class="primary" onclick="setBuildCheck(${day})" ${s.placed.length!==s.correct.length?'disabled':''}>Prüfen</button>
    </div>
  `;
}
function setBuildPlace(i){ if(setBuildState.used[i]) return; setBuildState.placed.push(setBuildState.bank[i]); setBuildState.used[i]=true; render(); }
function setBuildUnplace(i){
  const w = setBuildState.placed[i];
  setBuildState.placed.splice(i,1);
  const fIdx = setBuildState.bank.findIndex((b,j)=>b===w && setBuildState.used[j]);
  if(fIdx>=0) setBuildState.used[fIdx]=false;
  render();
}
function setBuildReset(){ setBuildState.placed=[]; setBuildState.used=setBuildState.used.map(()=>false); render(); }
function setBuildCheck(day){
  const ok = setBuildState.placed.join(" ").toLowerCase() === setBuildState.correct.join(" ").toLowerCase();
  if(ok){
    speak(setBuildState.sentence.sr);
    toast("✓ Stimmt!","good"); confettiBurst();
    markSetModule(day,"buildDone");
    setBuildState=null;
    setTimeout(()=>setView({type:'todaySet', day}), 800);
  } else {
    setBuildState.shake = true; sfx("bad");
    setTimeout(()=>{ setBuildState.shake=false; render(); }, 350);
  }
}

/* ===========================================================
   MATCH PAIRS GAME
   =========================================================== */
let matchState = null;
function renderMatch(){
  if(!matchState){
    const pool = pickN(TOP_WORDS, 8);
    const cells = [];
    pool.forEach((w,i)=>{
      cells.push({k:i, side:"sr", text:w.sr, raw:w});
      cells.push({k:i, side:"de", text:w.de, raw:w});
    });
    matchState = { cells: shuffle(cells), pool, sel:[], matched:new Set(), miss:null, tries:0, hits:0, start:Date.now(), finished:false };
  }
  const s = matchState;
  if(s.matched.size === s.pool.length && !s.finished){
    s.finished = true;
    state.matchWins = (state.matchWins||0) + 1;
    const elapsed = Math.round((Date.now()-s.start)/1000);
    const xp = Math.max(20, 60 - elapsed);
    awardXP(xp, `Memory · ${s.tries} Versuche, ${elapsed}s`);
    sfx("win"); confettiBurst();
  }
  $("#app").innerHTML = `
    ${detailHead("Memory-Match", "setTab('practice')")}
    <div class="speed-hud">
      <div><div class="v">${s.matched.size}/${s.pool.length}</div><div class="l">Paare</div></div>
      <div><div class="v">${s.tries}</div><div class="l">Versuche</div></div>
      <button class="ghost" onclick="matchState=null; render()">↻</button>
    </div>
    ${s.finished ? `
      <div class="card elev center" style="padding:30px">
        <div style="font-size:50px">🎉</div>
        <h1>Geschafft!</h1>
        <p class="muted">${s.tries} Versuche · ${Math.round((Date.now()-s.start)/1000)}s</p>
        <button class="primary" style="margin-top:12px" onclick="matchState=null; render()">Nochmal</button>
      </div>
    ` : `
      <div class="match-grid">
        ${s.cells.map((c,idx) => {
          const cls = ["mcell"];
          if(c.side==="sr") cls.push("sr");
          if(s.matched.has(c.k)) cls.push("matched");
          if(s.sel.includes(idx)) cls.push("sel");
          if(s.miss && s.miss.includes(idx)) cls.push("miss");
          return `<div class="${cls.join(" ")}" onclick="matchPick(${idx})">${c.side==="sr"?showText(c.text):c.text}</div>`;
        }).join("")}
      </div>
      <p class="muted tiny center" style="margin-top:14px">Verbinde serbisches Wort mit deutscher Übersetzung</p>
    `}
  `;
}
function matchPick(idx){
  const s = matchState;
  if(s.sel.includes(idx) || s.matched.has(s.cells[idx].k)) return;
  s.sel.push(idx);
  if(s.sel.length===2){
    s.tries++;
    const [a,b] = s.sel;
    if(s.cells[a].k === s.cells[b].k && s.cells[a].side !== s.cells[b].side){
      s.matched.add(s.cells[a].k);
      s.hits++; sfx("ok");
      s.sel = []; render();
      // play audio for matched word
      const w = s.cells[a].raw;
      setTimeout(()=>speak(w.sr), 100);
    } else {
      s.miss = [a,b]; sfx("bad");
      render();
      setTimeout(()=>{ s.sel=[]; s.miss=null; render(); }, 700);
    }
  } else {
    render();
  }
}

function speedStart(){
  speedState = {
    start: Date.now(), score:0, streak:0, over:false,
    pool: TOP_WORDS,
    cur:null, options:[]
  };
  speedNext();
  render();
  speedTick();
}
function speedNext(){
  const s = speedState;
  const w = s.pool[Math.floor(Math.random()*s.pool.length)];
  const distractors = shuffle(s.pool.filter(p=>p.de!==w.de)).slice(0,3).map(p=>p.de);
  s.cur = w;
  s.options = shuffle([w.de, ...distractors]);
}
function speedAnswer(opt){
  const s = speedState;
  if(s.over) return;
  if(opt === s.cur.de){
    s.score += 1 + (s.streak >= 3 ? 1 : 0);
    s.streak++;
    sfx("tick");
  } else {
    s.streak = 0;
    sfx("bad");
  }
  speedNext();
  render();
}
function speedTick(){
  if(!speedState || speedState.over) return;
  render();
  setTimeout(speedTick, 250);
}

/* ===========================================================
   LIVE-KONVERSATION — Dialog mit Spracherkennung
   App spricht NPC-Zeilen, du antwortest auf Serbisch.
   Bei Fehler/Time-out wird die Zeile auf Serbisch vorgesagt.
   =========================================================== */
let _liveCtx = null;
function renderDialogueLive(id){
  const d = DIALOGUES.find(x=>x.id===id);
  if(!d){ setTab("dialogues"); return; }
  if(_liveCtx){ _liveCtx.cancelled = true; }
  _liveCtx = { id, idx:0, cancelled:false, recognizer:null, attempts:0, stats:{ok:0, assisted:0}, lines:[] };

  $("#app").innerHTML = `
    ${detailHead("🎙️ " + d.title, "liveStop()")}
    <div class="dialog-scene"><b>${d.icon} Szene:</b> ${d.scene}</div>
    <div class="live-stage" id="live-stage"></div>
    <div class="live-status" id="live-status">
      <div class="dot"></div>
      <div class="grow">
        <div id="live-msg">Drücke <b>Start</b>, um die Konversation zu beginnen.</div>
        <div class="hint" id="live-hint">Die App spricht — du antwortest auf Serbisch. Bei Bedarf hilft sie dir.</div>
      </div>
    </div>
    <div class="live-actions">
      <button class="primary" id="live-start" onclick="liveStart()">▶ Start</button>
      <button id="live-help" onclick="liveHelp()" disabled>💡 Hilfe (Sag's vor)</button>
      <button id="live-skip" onclick="liveSkip()" disabled>⏭ Weiter</button>
    </div>
    <p class="muted tiny" style="margin-top:10px; text-align:center">
      Spracherkennung läuft auf <b>sr-RS</b>. Funktioniert am besten in Chrome/Safari.
    </p>
  `;

  if(!speechAvailable()){
    document.getElementById("live-msg").innerHTML =
      "⚠️ Dein Browser unterstützt keine Spracherkennung. <br>Nutze Chrome (Mac/Android) oder Safari (iOS).";
    document.getElementById("live-start").disabled = true;
  }
}

function liveSetStatus(state, msg, hint){
  const box = document.getElementById("live-status");
  if(!box) return;
  box.classList.remove("listening","speaking","help");
  if(state) box.classList.add(state);
  document.getElementById("live-msg").innerHTML = msg || "";
  document.getElementById("live-hint").innerHTML = hint || "";
}

function liveAppendBubble(line, opts){
  opts = opts || {};
  const stage = document.getElementById("live-stage");
  if(!stage) return null;
  const cls = ["dlg-line"];
  if(line.you) cls.push("you");
  if(opts.assisted) cls.push("assisted");
  if(opts.correct) cls.push("you-correct");
  const el = document.createElement("div");
  el.className = cls.join(" ");
  el.innerHTML = `
    <div class="dlg-avatar">${line.you?"DU":(line.who||"?").slice(0,2).toUpperCase()}</div>
    <div class="dlg-bubble ${opts.assisted?'assisted':''} ${opts.correct?'you-correct':''}">
      <div class="who">${line.who||""}${opts.assisted?' · 💡 Hilfe':''}${opts.correct?' · ✓':''}</div>
      <div class="sr">${showText(line.sr)}</div>
      <div class="de">${line.de}</div>
      ${opts.heard ? `<div class="heard">Gehört: „${opts.heard}"</div>`:''}
    </div>`;
  stage.appendChild(el);
  stage.scrollTop = stage.scrollHeight;
  return el;
}

function liveStart(){
  if(!_liveCtx) return;
  document.getElementById("live-start").disabled = true;
  liveStep();
}

function liveStop(){
  if(_liveCtx){ _liveCtx.cancelled = true; }
  try{ if(_liveCtx && _liveCtx.recognizer) _liveCtx.recognizer.abort(); }catch(e){}
  speechSynthesis.cancel();
  setTab("dialogues");
}

function liveStep(){
  const ctx = _liveCtx; if(!ctx || ctx.cancelled) return;
  const d = DIALOGUES.find(x=>x.id===ctx.id); if(!d) return;
  if(ctx.idx >= d.lines.length){ liveFinish(); return; }
  const line = d.lines[ctx.idx];
  ctx.attempts = 0;
  ctx.step = (ctx.step||0) + 1;
  const myStep = ctx.step;

  if(!line.you){
    // NPC-Zeile: vorlesen, dann weiter.
    liveAppendBubble(line, {});
    liveSetStatus("speaking",
      `<b>${line.who||"NPC"}:</b> ${showText(line.sr)}`,
      `<i>${line.de}</i>`);
    document.getElementById("live-help").disabled = true;
    document.getElementById("live-skip").disabled = false;
    liveSpeak(line.sr, () => {
      if(ctx.cancelled || ctx.step !== myStep) return;
      ctx.idx++;
      setTimeout(liveStep, 450);
    });
  } else {
    // Du bist dran: Zeile noch nicht zeigen, nur auffordern.
    liveSetStatus("listening",
      `🎙️ <b>Du:</b> Sag jetzt auf Serbisch…`,
      `Hinweis (Deutsch): <i>${line.de}</i> — drücke <b>💡 Hilfe</b>, wenn du nicht weiter weißt.`);
    document.getElementById("live-help").disabled = false;
    document.getElementById("live-skip").disabled = false;
    liveListen(line);
  }
}

function liveSpeak(text, onDone){
  if(!("speechSynthesis" in window)){ if(onDone) onDone(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "sr-RS"; u.rate = .9;
  const v = pickVoice(); if(v) u.voice = v;
  u.onend = () => { if(onDone) onDone(); };
  u.onerror = () => { if(onDone) onDone(); };
  speechSynthesis.speak(u);
}

function liveListen(line){
  const ctx = _liveCtx; if(!ctx || ctx.cancelled) return;
  if(!speechAvailable()){
    liveAssist(line, "Spracherkennung nicht verfügbar.");
    return;
  }
  ctx.attempts++;
  ctx.recognizer = startListening(
    alts => {
      if(!_liveCtx || _liveCtx.cancelled) return;
      const best = alts[0] || "";
      let bestSim = 0;
      for(const a of alts){
        const s = similarity(a, line.sr);
        if(s > bestSim) bestSim = s;
      }
      if(bestSim >= 0.6){
        // Erfolg
        liveAppendBubble(line, {correct:true, heard:best});
        ctx.stats.ok++;
        sfx("ok");
        liveSetStatus("", `✓ Super! <b>${showText(line.sr)}</b>`, `<i>${line.de}</i>`);
        setTimeout(()=>{ if(_liveCtx && !_liveCtx.cancelled){ ctx.idx++; liveStep(); } }, 900);
      } else {
        // Daneben — bei zweitem Versuch helfen
        if(ctx.attempts >= 2){
          liveAssist(line, `Gehört: „${best}" — schauen wir's nochmal an.`);
        } else {
          liveSetStatus("listening",
            `🤔 Hmm — gehört: „${best}". Versuch's nochmal!`,
            `Soll: <i>${showText(line.sr)}</i> &nbsp;·&nbsp; ${line.de}`);
          setTimeout(()=>{ if(_liveCtx && !_liveCtx.cancelled) liveListen(line); }, 1200);
        }
      }
    },
    err => {
      if(!_liveCtx || _liveCtx.cancelled) return;
      // no-speech / aborted / not-allowed → Hilfe-Modus
      if(/Mikrofon-Zugriff/i.test(err)){
        liveSetStatus("help", "🎤 " + err, "Browser-Einstellungen prüfen, dann erneut starten.");
        document.getElementById("live-start").disabled = false;
        return;
      }
      liveAssist(line, err);
    }
  );
}

function liveAssist(line, reason){
  const ctx = _liveCtx; if(!ctx || ctx.cancelled) return;
  ctx.stats.assisted++;
  liveAppendBubble(line, {assisted:true});
  liveSetStatus("help",
    `💡 Sag das so: <b>${showText(line.sr)}</b>`,
    `${reason||""} — Ich spreche es jetzt vor, dann sprich's nach.`);
  liveSpeak(line.sr, () => {
    if(!_liveCtx || _liveCtx.cancelled) return;
    // Nochmal langsamer, dann weiter
    setTimeout(()=>{
      if(!_liveCtx || _liveCtx.cancelled) return;
      const u = new SpeechSynthesisUtterance(line.sr);
      u.lang="sr-RS"; u.rate=.7;
      const v = pickVoice(); if(v) u.voice=v;
      u.onend = () => {
        if(!_liveCtx || _liveCtx.cancelled) return;
        setTimeout(()=>{ if(_liveCtx && !_liveCtx.cancelled){ ctx.idx++; liveStep(); } }, 600);
      };
      speechSynthesis.speak(u);
    }, 350);
  });
}

function liveHelp(){
  const ctx = _liveCtx; if(!ctx || ctx.cancelled) return;
  const d = DIALOGUES.find(x=>x.id===ctx.id); if(!d) return;
  const line = d.lines[ctx.idx]; if(!line || !line.you) return;
  try{ if(ctx.recognizer) ctx.recognizer.abort(); }catch(e){}
  liveAssist(line, "Du hast um Hilfe gebeten.");
}

function liveSkip(){
  const ctx = _liveCtx; if(!ctx || ctx.cancelled) return;
  const d = DIALOGUES.find(x=>x.id===ctx.id); if(!d) return;
  const line = d.lines[ctx.idx]; if(!line) return;
  ctx.step = (ctx.step||0) + 1;          // invalidiert pendente Callbacks
  try{ if(ctx.recognizer) ctx.recognizer.abort(); }catch(e){}
  speechSynthesis.cancel();
  if(line.you){
    liveAppendBubble(line, {assisted:true});
    ctx.stats.assisted++;
  }
  // NPC-Zeile wurde in liveStep schon angezeigt — nicht doppelt anhängen.
  ctx.idx++;
  setTimeout(liveStep, 200);
}

function liveFinish(){
  const ctx = _liveCtx; if(!ctx) return;
  const d = DIALOGUES.find(x=>x.id===ctx.id);
  const total = ctx.stats.ok + ctx.stats.assisted;
  const pct = total ? Math.round(ctx.stats.ok / total * 100) : 0;
  liveSetStatus("",
    `🎉 Konversation beendet — <b>${ctx.stats.ok}</b> selbst, <b>${ctx.stats.assisted}</b> mit Hilfe (${pct}% solo).`,
    `Gut gemacht! Nochmal üben festigt's.`);
  document.getElementById("live-start").disabled = false;
  document.getElementById("live-start").textContent = "↻ Nochmal";
  document.getElementById("live-start").onclick = () => setView({type:"dialogueLive", id: ctx.id});
  document.getElementById("live-help").disabled = true;
  document.getElementById("live-skip").disabled = true;

  // XP belohnen
  if(d){
    const xp = 25 + ctx.stats.ok * 3;
    awardXP(xp, `Live-Konversation · ${d.title}`);
    if(!(state.dialoguesDone||[]).includes(d.id)){
      state.dialoguesDone = state.dialoguesDone || [];
      state.dialoguesDone.push(d.id);
    }
    save();
  }
  if(pct >= 70) confettiBurst();
}

/* ===========================================================
   PRE-TEST — Test-Enhanced Learning (Richland 2009)
   3 Vorab-Fragen markieren Bekanntes & primen das Gehirn.
   =========================================================== */
let preTestState = null;
function renderPreTest(level, lessonId){
  const les = findLesson(level, lessonId);
  if(!preTestState || preTestState.lessonId !== lessonId){
    const items = pickN(les.vocab, Math.min(3, les.vocab.length));
    const allDe = LESSONS[level].lessons.flatMap(l=>l.vocab.map(v=>v.de));
    preTestState = { lessonId, deck:items, idx:0, picks:[], allDe };
  }
  const s = preTestState;
  if(s.idx >= s.deck.length){
    // Auswertung: bekannte Wörter überspringen / als bekannt markieren
    const known = s.picks.filter(p=>p.correct).map(p=>p.sr);
    state.preTestDone[lessonId] = { skipped: known, at: todayStr() };
    for(const sr of known){
      // 1× sehr leichtes „Easy" → SRS macht großen Stability-Sprung
      if(!state.fsrs[sr]) srsRecord(sr, 5);
    }
    save();
    $("#app").innerHTML = `
      ${detailHead("Pre-Test", `setView({type:'lesson', level:${level}, lessonId:'${lessonId}'})`)}
      <div class="card elev center" style="padding:30px">
        <div style="font-size:46px">🎯</div>
        <h1>${known.length}/${s.deck.length} schon drauf</h1>
        <p class="muted" style="max-width:36ch; margin:8px auto 18px">
          Test vor dem Lernen — Richland 2009: aktiviert das Vorwissen und macht das Lernen messbar effizienter ${scienceLink('recall')}
        </p>
        <button class="primary" onclick="preTestState=null; setView({type:'flashcards', level:${level}, lessonId:'${lessonId}'})">Karten starten →</button>
      </div>`;
    return;
  }
  const q = s.deck[s.idx];
  if(!s.options || s.optionsFor !== q.sr){
    const distractors = shuffle(s.allDe.filter(d=>d!==q.de)).slice(0,3);
    s.options = shuffle([q.de, ...distractors]);
    s.optionsFor = q.sr;
  }
  $("#app").innerHTML = `
    ${detailHead("Pre-Test · " + les.title, `setView({type:'lesson', level:${level}, lessonId:'${lessonId}'})`)}
    <div class="row between" style="margin-bottom:8px">
      <span class="muted tiny">Schon bekannt? ${s.idx+1}/${s.deck.length}</span>
      ${scienceLink('recall')}
    </div>
    <div class="bar thin" style="margin-bottom:14px"><i style="width:${(s.idx/s.deck.length)*100}%"></i></div>
    <div class="pretest-q">
      <div class="pq">${showText(q.sr)}</div>
      <div class="ps">${q.ipa?'['+q.ipa+'] · ':''}Was bedeutet das auf Deutsch?</div>
    </div>
    <div class="quiz-options">
      ${s.options.map((o,i)=>`<button onclick="preTestPick('${jsStr(o)}')"><span class="num">${i+1}</span>${o}</button>`).join("")}
    </div>
    <div class="row" style="justify-content:center; margin-top:14px">
      <button class="ghost" onclick="preTestPick('__skip__')">Weiß nicht — überspringen</button>
    </div>
  `;
}
function preTestPick(opt){
  const s = preTestState;
  const q = s.deck[s.idx];
  s.picks.push({ sr:q.sr, correct: opt === q.de });
  s.idx++; s.options = null;
  render();
}

/* ===========================================================
   INTERLEAVE-MIX — Rohrer & Taylor 2007, Hwang 2025
   Mischt Wörter aus mehreren Lessons / Days, dazwischen Chunks.
   Adaptiv: Anfänger (knownTotal<30) bekommen weniger Mix.
   =========================================================== */
let ilState = null;
function buildInterleaveDeck(){
  const pool = [];
  for(const k of Object.keys(LESSONS)){
    if(parseInt(k) > state.unlockedLevel) continue;
    for(const les of LESSONS[k].lessons) for(const w of les.vocab) pool.push({type:"w", item:w});
  }
  for(const c of CHUNKS) pool.push({type:"c", item:c});
  const cov = coverageStats();
  const adaptive = state.interleaveLevel === "adaptive";
  // Bei wenig bekanntem Material: kleinere Decks und Wort-lastig
  const size = adaptive ? (cov.totalKnown < 30 ? 10 : (cov.totalKnown < 100 ? 14 : 20)) : 18;
  return pickN(pool, size);
}
function renderInterleave(){
  pomodoroCheck();
  if(!ilState){
    ilState = { deck: buildInterleaveDeck(), idx:0, flipped:false, score:0 };
  }
  if(ilState.idx >= ilState.deck.length){
    awardXP(ilState.score*3, `Interleave · ${ilState.score} korrekt`);
    $("#app").innerHTML = `
      ${detailHead("Interleave-Mix", "setTab('practice')")}
      <div class="card elev center" style="padding:30px">
        <div style="font-size:46px">🔀</div>
        <h1>${ilState.score}/${ilState.deck.length}</h1>

          Mischpraxis schlägt Block-Praxis im Langzeittest (delayed posttest). ${scienceLink('interleave')}
        </p>
        <div class="row" style="justify-content:center; gap:8px; margin-top:14px">
          <button onclick="ilState=null; render()">↻ Neuer Mix</button>
          <button class="primary" onclick="ilState=null; setTab('practice')">Fertig</button>
        </div>
      </div>`;
    return;
  }
  const e = ilState.deck[ilState.idx];
  const sr = e.type==="w" ? e.item.sr : e.item.sr;
  const de = e.type==="w" ? e.item.de : e.item.de;
  const flipped = ilState.flipped;
  $("#app").innerHTML = `
    ${detailHead("Interleave-Mix", "setTab('practice')")}
    <div class="row between" style="margin-bottom:8px">
      <span class="muted tiny">${ilState.idx+1}/${ilState.deck.length} · ${e.type==='w'?'Wort':'Phrase'}</span>
      ${scienceLink('interleave')}
    </div>
    <div class="bar thin" style="margin-bottom:14px"><i style="width:${(ilState.idx/ilState.deck.length)*100}%"></i></div>
    <div class="flashcard-wrap">
      <div class="flashcard ${flipped?'flipped':''}" onclick="ilFlip()">
        <div class="face front">
          <button class="icon-btn play-btn" onclick="event.stopPropagation(); speak('${jsStr(sr)}')">🔊</button>
          <div class="word">${showText(sr)}</div>
          <div class="hint">${e.type==='w'?'Wort':'Chunk / Phrase'} — tippen zum Auflösen</div>
        </div>
        <div class="face back">
          <div class="muted tiny" style="margin-bottom:8px">Bedeutung</div>
          <div class="word" style="font-size:24px">${de}</div>
          <div class="hint">Wie sicher?</div>
        </div>
      </div>
    </div>
    ${flipped ? `
      <div class="qrow">
        <button class="q-again" onclick="ilAnswer(0)"><span class="ql">Nochmal</span><span class="qs">jetzt</span></button>
        <button class="q-hard"  onclick="ilAnswer(3)"><span class="ql">Schwer</span></button>
        <button class="q-good"  onclick="ilAnswer(4)"><span class="ql">Gut</span></button>

    ` : `<div class="row" style="justify-content:center; margin-top:14px"><button class="primary lg" onclick="ilFlip()">Auflösen</button></div>`}

}
function ilFlip(){ ilState.flipped = !ilState.flipped; render(); }
function ilAnswer(q){
  const e = ilState.deck[ilState.idx];

  save(); render();
}

/* ===========================================================

   =========================================================== */
document.addEventListener("keydown", e=>{
  const tag = (e.target.tagName||"").toLowerCase();
  if(tag === "input" || tag === "textarea") return;
  const v = state.view;
  if(e.key === " " || e.key === "Spacebar"){
    if(v.type==="flashcards"){ e.preventDefault(); fcFlip(); }
    else if(v.type==="srs"){ e.preventDefault(); srsFlip(); }
  }
  if(e.key === "1" || e.key === "2" || e.key === "3" || e.key === "4"){
    if(v.type==="flashcards" && fcState && fcState.flipped){ const map={1:0,2:3,3:4,4:5}; fcAnswer(map[e.key]); }
    if(v.type==="srs" && srsState && srsState.flipped){ const map={1:0,2:3,3:4,4:5}; srsAnswer(map[e.key]); }
    if(v.type==="quiz" && qzState && qzState.options && qzState.picked===null){
      const i = parseInt(e.key)-1;
      if(qzState.options[i]) qzPick(qzState.options[i]);
    }
    if(v.type==="speedRound" && speedState && !speedState.over){
      const i = parseInt(e.key)-1;
      if(speedState.options[i]) speedAnswer(speedState.options[i]);
    }
  }
  if(e.key === "Escape"){
    if(document.getElementById("sheet").classList.contains("show")){ hideSheet(); return; }
    if(v.tab && v.type !== v.tab) setTab(v.tab);
  }
});

let sessionState = null;

function norm(s){ return (s||"").toLowerCase().trim().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 ]/g,""); }
function deDistractors(w,n){ return shuffle(TOP_WORDS.filter(x=>x.de!==w.de)).slice(0,n).map(x=>x.de); }
function srDistractors(w,n){ return shuffle(TOP_WORDS.filter(x=>x.sr!==w.sr)).slice(0,n).map(x=>x.sr); }

/* nächstes Einzelwort: erst fällige Reviews, dann neue Tageswörter, dann unbekannte Top-Wörter */
/* Anti-Wiederholung: dieselben Basis-Wörter (zdravo/hvala/dobar dan…)
   nicht direkt hintereinander zeigen. Merkt sich die letzten paar. */
let _recentSrs = [];
function _notRecent(arr){ const f = arr.filter(w=>w&&!_recentSrs.includes(w.sr)); return f.length ? f : arr; }
function _markRecent(w){ if(!w||!w.sr) return; _recentSrs.push(w.sr); if(_recentSrs.length>6) _recentSrs.shift(); }
function nextWordForSession(){
  const due = srsDueWords();
  if(due.length){ const w=pickN(_notRecent(due),1)[0]; _markRecent(w); return {w, isNew:false}; }
  const set = getSet(state.currentDay);
  if(set){
    for(const sr of set.new){
      const w = findWordBySr(sr);
      if(!w._missing && !state.fsrs[w.sr] && !state.srs[w.sr]){ _markRecent(w); return {w, isNew:true}; }
    }
  }
  const unknown = TOP_WORDS.filter(w=>!isWordKnown(w.sr));
  if(unknown.length){ const w=pickN(_notRecent(unknown),1)[0]; _markRecent(w); return {w, isNew:false}; }
  const w = pickN(_notRecent(TOP_WORDS),1)[0]; _markRecent(w); return {w, isNew:false};
}
function mcOptions(w, dir){
  if(dir==="sr2de"){
    return {options: shuffle([w.de, ...deDistractors(w,3)]), correct:w.de, promptText:w.sr};
  }
  return {options: shuffle([w.sr, ...srDistractors(w,3)]), correct:w.sr, promptText:w.de};
}
function buildTypeItem(w){ return {kind:"type", w, phase:"q", correct:w.sr, promptText:w.de}; }
function buildPairsItem(){
  const due = srsDueWords();
  const pool = due.length>=4 ? due : TOP_WORDS;
  const words = pickN(pool,4);
  if(words.length<4) return null;
  const cells=[];
  words.forEach((w,i)=>{ cells.push({k:i,side:"sr",text:w.sr}); cells.push({k:i,side:"de",text:w.de}); });
  return {kind:"pairs", phase:"q", words, cells:shuffle(cells), sel:[], matched:[], miss:null};
}
function buildSentenceItem(){
  const maxDay = Math.min(state.currentDay, LEARN_SETS.length);
  const cands = LEARN_SETS.slice(0, Math.max(1,maxDay))
    .filter(s=>s.build && s.build.sr && s.build.sr.split(/\s+/).length>=2 && s.build.sr.split(/\s+/).length<=7);
  if(!cands.length) return null;
  const set = cands[Math.floor(Math.random()*cands.length)];
  const tokens = set.build.sr.split(/\s+/);
  return {kind:"build", phase:"q", de:set.build.de, sr:set.build.sr, tokens,
          pool: shuffle(tokens.map(t=>({t}))), chosen:[]};
}
function buildSessionItem(){
  const n = sessionState.answered;
  if(n>0 && n%6===0){ const it=buildPairsItem(); if(it) return it; }
  if(n>0 && n%4===0){ const it=buildSentenceItem(); if(it) return it; }
  const pick = nextWordForSession();
  const w = pick.w;
  if(pick.isNew) return Object.assign({kind:"mc", dir:"sr2de", w, phase:"intro"}, mcOptions(w,"sr2de"));
  const r = n%5;
  if(r===1 && !state.skipListening) return Object.assign({kind:"listen", w, phase:"q"}, mcOptions(w,"sr2de"));
  if(r===4) return buildTypeItem(w);
  const dir = (r===0||r===3) ? "de2sr" : "sr2de";
  return Object.assign({kind:"mc", dir, w, phase:"q"}, mcOptions(w,dir));
}

/* --- Bewertung: speist FSRS, XP, Combo, Streak --- */
function gradeSession(w, correct){
  if(w && w.sr) srsRecord(w.sr, correct?4:0);
  if(correct){
    sessionState.combo++;
    sessionState.best = Math.max(sessionState.best, sessionState.combo);
    const xp = 5 + Math.min(10, sessionState.combo);
    sessionState.xpGained += xp;
    awardXP(xp);
    sfx("ok");
    if([5,10,20,30,50].includes(sessionState.combo)){ confettiBurst(); sfx("win"); toast(`🔥 ${sessionState.combo}er-Combo!`,"good"); }
  } else {
    sessionState.combo = 0;
    sfx("bad");
  }
  sessionState.answered++;
  if(sessionState.answered === 1) bumpStreak();
  save();
}
function scheduleAdvance(ms){
  clearTimeout(_advTimer);
  _advTimer = setTimeout(()=>{ if(state.view.type==="session") sessNext(); }, ms);
}
function sessNext(){ sessionState.item = buildSessionItem(); render(); }
function introContinue(){ sessionState.item.phase = "q"; render(); }

/* --- Antwort-Handler --- */
function sessAnswer(i){
  const it = sessionState.item;
  if(!it || it.locked || it.phase!=="q") return;
  const val = it.options[i];
  it.locked = true; it.picked = val; it.wasCorrect = (val===it.correct);
  gradeSession(it.w, it.wasCorrect);
  render();
  scheduleAdvance(it.wasCorrect ? 850 : 1700);
}
function sessPair(idx){
  const it = sessionState.item;
  if(!it || it.locked || it.matched.includes(idx)) return;
  if(it.sel.includes(idx)){ it.sel = it.sel.filter(x=>x!==idx); render(); return; }
  it.sel.push(idx);
  if(it.sel.length===2){
    const [a,b] = it.sel;
    if(it.cells[a].k===it.cells[b].k && it.cells[a].side!==it.cells[b].side){
      it.matched.push(a,b); it.sel=[]; sfx("ok");
      if(it.matched.length===it.cells.length){
        it.locked = true;
        it.words.forEach(w=>srsRecord(w.sr,4));
        gradeSession(null,true);
        render(); scheduleAdvance(750); return;
      }
    } else {
      it.miss=[a,b]; it.sel=[]; sfx("bad");
      setTimeout(()=>{ if(sessionState.item===it){ it.miss=null; render(); } }, 550);
    }
  }
  render();
}
function sessBuildPick(i){
  const it = sessionState.item;
  if(!it || it.locked) return;
  it.chosen.push(i);
  if(it.chosen.length===it.tokens.length){ sessBuildCheck(); return; }
  render();
}
function sessBuildUndo(k){
  const it = sessionState.item;
  if(!it || it.locked) return;
  it.chosen.splice(k,1); render();
}
function sessBuildCheck(){
  const it = sessionState.item;
  it.locked = true;
  const got = it.chosen.map(i=>it.pool[i].t).join(" ");
  it.wasCorrect = norm(got)===norm(it.sr);
  it.fbKind = it.wasCorrect ? "good" : "bad";
  it.fb = it.wasCorrect ? "✓ Tačno!" : `✗ ${it.sr}`;
  gradeSession(null, it.wasCorrect);
  render(); scheduleAdvance(it.wasCorrect ? 900 : 1900);
}
function sessTypeCheck(){
  const it = sessionState.item;
  if(!it || it.locked) return;
  const inp = document.getElementById("sxinp");
  const v = inp ? inp.value : "";
  it.locked = true; it.picked = v;
  it.wasCorrect = norm(v)===norm(it.correct);
  it.fbKind = it.wasCorrect ? "good" : "bad";
  it.fb = it.wasCorrect ? "✓ Richtig!" : `✗ ${it.correct}`;
  gradeSession(it.w, it.wasCorrect);
  render(); scheduleAdvance(it.wasCorrect ? 900 : 1900);
}

/* --- Session beenden (mit sanftem Nudge unter Tagesziel) --- */
function sessEnd(force){
  const rem = Math.max(0,(state.dailyMinutesGoal||30)-(state.minutesToday||0));
  if(!force && rem>0){
    const c = document.getElementById("sheetContent");
    c.innerHTML = `
      <h2 style="margin-bottom:6px">Schon Schluss? 🙈</h2>
      <p class="muted" style="margin-bottom:16px">Heute noch <b>${rem} Min</b> bis dein Slot erfüllt ist. Dranbleiben zahlt sich aus 💪</p>
      <button class="primary lg full" onclick="hideSheet()">Weiter lernen</button>
      <button class="ghost full" style="margin-top:8px" onclick="hideSheet(); sessEnd(true)">Trotzdem schliessen</button>`;
    showSheet(); return;
  }
  stopLearnTimer(); sessionState = null; setTab('home');
}

/* --- Render: Session-Container + Item --- */
function renderSession(){
  if(!sessionState){
    sessionState = {combo:0, best:0, xpGained:0, answered:0, item:null,
                    chapterBaseMin:(state.minutesToday||0), chapterBreak:false};
    sessionState.item = buildSessionItem();
  }
  startLearnTimer();
  const it = sessionState.item;
  const mins = state.minutesToday||0, goal = state.dailyMinutesGoal||30;
  const top = `
    <div class="session-top">
      <button class="icon-btn" onclick="sessEnd(false)" aria-label="Schliessen">✕</button>
      <div class="sess-prog"><i id="sessMinFill" style="width:${Math.min(100,Math.round(mins/goal*100))}%"></i></div>
      <span class="sess-min" id="sessMin">${mins}/${goal}m</span>
      <span class="sess-combo">🔥 ${sessionState.combo}</span>
    </div>`;
  let body = "";
  if(sessionState.chapterBreak){ body = renderSessChapterBreak(); }
  else if(!it){ body = `<div class="card elev center" style="padding:30px"><div style="font-size:46px">🎉</div><h2>Alles wiederholt!</h2><button class="primary" style="margin-top:12px" onclick="sessNext()">Weiter</button></div>`; }
  else if(it.kind==="mc" && it.phase==="intro") body = renderSessIntro(it);
  else if(it.kind==="mc")     body = renderSessMc(it);
  else if(it.kind==="listen") body = renderSessListen(it);
  else if(it.kind==="pairs")  body = renderSessPairs(it);
  else if(it.kind==="build")  body = renderSessBuild(it);
  else if(it.kind==="type")   body = renderSessType(it);
  $("#app").innerHTML = `<div class="session">${top}${body}</div>`;
  if(!sessionState.chapterBreak){
    if(it && it.phase==="intro" && !it._spoke){ it._spoke=true; setTimeout(()=>speak(it.w.sr),250); }
    if(it && it.kind==="listen" && it.phase==="q" && !it._spoke){ it._spoke=true; setTimeout(()=>speak(it.w.sr),250); }
    if(it && it.kind==="type" && !it.locked){ const i=document.getElementById("sxinp"); if(i) i.focus(); }
  }
}
function renderSessChapterBreak(){
  const chLen = state.chapterMinutes||5;
  const goal  = state.dailyMinutesGoal||30;
  const mins  = state.minutesToday||0;
  const chDone  = Math.max(1, Math.round(mins/chLen));
  const chTotal = Math.max(1, Math.round(goal/chLen));
  const goalReached = mins>=goal;
  return `
    <div class="card elev center" style="padding:30px; margin-top:20px">
      <div style="font-size:46px">${goalReached?'🏆':'☕'}</div>
      <h2 style="margin-top:6px">${goalReached?'Tagesziel geschafft!':`Kapitel ${chDone} geschafft!`}</h2>
      <p class="muted" style="margin:8px 0 4px">${chLen} Minuten am Stück — bravo.${goalReached?'':' Kurz durchatmen, dann weiter? 🍺'}</p>
      <div class="sess-prog" style="margin:14px 0"><i style="width:${Math.min(100,Math.round(mins/goal*100))}%"></i></div>
      <div class="muted tiny" style="margin-bottom:16px">${mins}/${goal} Min · Kapitel ${Math.min(chDone,chTotal)}/${chTotal}</div>
      <button class="primary lg full" onclick="chapterContinue()">${goalReached?'Noch ein Kapitel 💪':`Nächstes Kapitel (${chLen} Min) →`}</button>
      <button class="ghost full" style="margin-top:8px" onclick="sessEnd(true)">${goalReached?'Fertig für heute ✓':'Pause machen'}</button>
    </div>`;
}
function chapterContinue(){
  if(!sessionState) return;
  sessionState.chapterBreak = false;
  sessionState.chapterBaseMin = state.minutesToday||0;
  sessNext();
}
function renderSessIntro(it){
  return `
    <div class="q-prompt" style="margin-top:24px">
      <span class="badge" style="background:rgba(255,181,71,.16); color:var(--accent); border-color:rgba(255,181,71,.3)">✨ NEU</span>
      <div class="q-word" style="margin-top:16px">${showText(it.w.sr)} <button class="icon-btn" onclick="speak('${jsStr(it.w.sr)}')" aria-label="Hören">🔊</button></div>
      <div class="q-sub" style="font-size:19px; margin-top:8px; color:var(--text-2)">${it.w.de}</div>
      ${it.w.ipa?`<div style="color:var(--good); font-size:13px; margin-top:4px; font-style:italic">[${it.w.ipa}]</div>`:""}
    </div>
    <button class="primary lg full" style="margin-top:22px" onclick="introContinue()">Verstanden →</button>`;
}
function renderSessMc(it){
  const ans = it.locked;
  return `
    <div class="q-prompt">
      <div class="q-sub">${it.dir==="sr2de"?"Was heisst das?":"Wie sagt man das auf Serbisch?"}</div>
      <div class="q-word">${it.dir==="sr2de"?showText(it.promptText):it.promptText} ${it.dir==="sr2de"?`<button class="icon-btn" onclick="speak('${jsStr(it.w.sr)}')" aria-label="Hören">🔊</button>`:""}</div>
    </div>
    <div class="opts">
      ${it.options.map((o,i)=>{
        let cls="opt";
        if(ans){ if(o===it.correct) cls+=" correct"; else if(o===it.picked) cls+=" wrong"; else cls+=" dim"; }
        const disp = it.dir==="de2sr" ? showText(o) : o;
        return `<button class="${cls}" ${ans?"":`onclick="sessAnswer(${i})"`}>${disp}</button>`;
      }).join("")}
    </div>
    ${ans?`<div class="sess-fb ${it.wasCorrect?'good':'bad'}">${it.wasCorrect?"✓ Richtig!":`✗ ${it.dir==='de2sr'?showText(it.correct):it.correct}`}</div>`:""}`;
}
function renderSessListen(it){
  const ans = it.locked;
  return `
    <div class="q-prompt">
      <div class="q-sub">Hören & verstehen</div>
      <button class="listen-big" onclick="speak('${jsStr(it.w.sr)}')" aria-label="Nochmal abspielen">🔊</button>
      ${ans?`<div class="q-word" style="font-size:24px; margin-top:12px">${showText(it.w.sr)}</div>`:`<div class="q-sub" style="margin-top:8px">Tippe auf 🔊 zum Wiederholen</div>`}
    </div>
    <div class="opts">
      ${it.options.map((o,i)=>{
        let cls="opt";
        if(ans){ if(o===it.correct) cls+=" correct"; else if(o===it.picked) cls+=" wrong"; else cls+=" dim"; }
        return `<button class="${cls}" ${ans?"":`onclick="sessAnswer(${i})"`}>${o}</button>`;
      }).join("")}
    </div>
    ${ans?`<div class="sess-fb ${it.wasCorrect?'good':'bad'}">${it.wasCorrect?"✓ Richtig!":`✗ ${it.correct}`}</div>`:""}`;
}
function renderSessPairs(it){
  return `
    <div class="q-prompt"><div class="q-sub">Verbinde die Paare</div></div>
    <div class="pairs-grid">
      ${it.cells.map((c,idx)=>{
        let cls = "pcell" + (c.side==="sr"?" sr":"");
        if(it.matched.includes(idx)) cls+=" matched";
        if(it.sel.includes(idx)) cls+=" sel";
        if(it.miss && it.miss.includes(idx)) cls+=" miss";
        const disp = c.side==="sr" ? showText(c.text) : c.text;
        return `<button class="${cls}" onclick="sessPair(${idx})">${disp}</button>`;
      }).join("")}
    </div>`;
}
function renderSessBuild(it){
  const done = it.chosen.length===it.tokens.length;
  return `
    <div class="q-prompt"><div class="q-sub">Bau den Satz</div><div class="q-word" style="font-size:23px; line-height:1.3">${it.de}</div></div>
    <div class="tray">${it.chosen.length ? it.chosen.map((pi,k)=>`<button class="wtile" ${it.locked?"":`onclick="sessBuildUndo(${k})"`}>${showText(it.pool[pi].t)}</button>`).join("") : '<span class="muted tiny">Tippe die Wörter in der richtigen Reihenfolge</span>'}</div>
    <div class="tiles">${it.pool.map((p,i)=> (it.chosen.includes(i)||it.locked) ? "" : `<button class="wtile" onclick="sessBuildPick(${i})">${showText(p.t)}</button>`).join("")}</div>
    ${it.fb?`<div class="sess-fb ${it.fbKind}">${it.fb}</div>`:(done&&!it.locked?`<button class="primary lg full" style="margin-top:16px" onclick="sessBuildCheck()">Prüfen</button>`:"")}`;
}
function renderSessType(it){
  return `
    <div class="q-prompt"><div class="q-sub">Tippe auf Serbisch</div><div class="q-word" style="font-size:30px">${it.promptText}</div></div>
    <input class="typing-input" id="sxinp" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="…" ${it.locked?"disabled":""} value="${jsStr(it.picked||'')}" onkeydown="if(event.key==='Enter')sessTypeCheck()"/>
    ${it.fb?`<div class="sess-fb ${it.fbKind}">${it.fb}</div>`:`<button class="primary lg full" style="margin-top:14px" onclick="sessTypeCheck()">Prüfen</button>`}`;
}
function startSession(){ setView({type:'session'}); }

/* ===========================================================
   LERNZEIT-TIMER — tägliche 30-Min-Slots (Selbstverpflichtung)
   Läuft nur während aktiver Session & sichtbarem Tab.
   =========================================================== */
function tickMinutes(){
  const t = todayStr();
  if(state.minutesDate !== t){ state.minutesToday = 0; state.minutesDate = t; save(); }
}
let _learnTimer = null, _learnSec = 0;
function startLearnTimer(){
  if(_learnTimer) return;
  tickMinutes();
  _learnTimer = setInterval(()=>{
    if(document.hidden) return;
    if(state.view.type !== "session") return;
    _learnSec++;
    if(_learnSec >= 60){
      _learnSec = 0; tickMinutes();
      state.minutesToday = (state.minutesToday||0) + 1; save();
      refreshSessTime();
      const goalNow = (state.dailyMinutesGoal||30);
      if(state.minutesToday === goalNow){
        bumpStreak(); confettiBurst(); sfx("win");
        toast(`✅ ${goalNow}-Min-Slot geschafft! 🔥`,"good");
      }
      // 5-Min-Kapitel: nach jedem Kapitel kurzer Checkpoint + Pause-Option
      const chLen = state.chapterMinutes||0;
      if(sessionState && !sessionState.chapterBreak && chLen>0 &&
         (state.minutesToday - (sessionState.chapterBaseMin||0)) >= chLen){
        sessionState.chapterBreak = true;
        if(state.minutesToday < goalNow) sfx("win");
        if(state.view.type==="session") renderSession();
      }
    }
  }, 1000);
}
function stopLearnTimer(){ if(_learnTimer){ clearInterval(_learnTimer); _learnTimer = null; _learnSec = 0; } }
function refreshSessTime(){
  const mins = state.minutesToday||0, goal = state.dailyMinutesGoal||30;
  const f = document.getElementById("sessMinFill"); if(f) f.style.width = Math.min(100,Math.round(mins/goal*100))+"%";
  const t = document.getElementById("sessMin"); if(t) t.textContent = mins+"/"+goal+"m";
}

/* --- Slot-Verwaltung --- */
function editSlot(){
  const t = prompt("Wann ist dein täglicher Serbisch-Slot? (HH:MM)", state.slotTime||"19:00");
  if(t && /^\d{1,2}:\d{2}$/.test(t.trim())){ state.slotTime = t.trim(); save(); render(); toast("Slot gespeichert ⏰","good"); }
}
function downloadSlotIcs(){
  const [hh,mm] = (state.slotTime||"19:00").split(":");
  const now = new Date();
  const y=now.getFullYear(), m=String(now.getMonth()+1).padStart(2,'0'), d=String(now.getDate()).padStart(2,'0');
  const start = `${y}${m}${d}T${String(hh).padStart(2,'0')}${mm}00`;
  const ics = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//SrpskiStudio//Slot//DE","CALSCALE:GREGORIAN",
    "BEGIN:VEVENT","UID:srpski-slot-"+Date.now()+"@kaito","SUMMARY:🇷🇸 Serbisch lernen (30 Min)",
    `DTSTART;TZID=Europe/Zurich:${start}`,"DURATION:PT30M","RRULE:FREQ=DAILY",
    "DESCRIPTION:Täglicher 30-Minuten-Slot. Dranbleiben! 🍺","BEGIN:VALARM","TRIGGER:PT0M","ACTION:DISPLAY","DESCRIPTION:Vreme je! Serbisch lernen","END:VALARM",
    "END:VEVENT","END:VCALENDAR"].join("\r\n");
  const blob = new Blob([ics], {type:"text/calendar"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "serbisch-slot.ics"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  toast("Kalendereintrag geladen 📅","good");
}

(function mountSessionBar(){
  const bar = document.createElement("div");
  bar.className = "session-bar";
  bar.id = "sessionBar";
  document.body.appendChild(bar);
